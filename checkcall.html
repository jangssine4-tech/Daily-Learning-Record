<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="체크콜">
<meta name="theme-color" content="#17203A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="checkcall-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="checkcall-icon-192.png">
<title>체크콜 – 교재 점검</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#17203A;--ink2:#5A6378;--ink3:#8B93A7;
  --bg:#ECEFF6;--card:#fff;--line:#DCE1EC;--line2:#EEF1F7;
  --blue:#3E63DD;--teal:#12A594;--violet:#8E4EC6;--amber:#E5960B;--go:#0E9F6E;--red:#E5484D;
  --font:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.screen{display:none;min-height:100%;padding:clamp(14px,4vw,32px);align-items:center;justify-content:center;flex-direction:column}
.screen.on{display:flex}

/* ── 로고 ── */
.mark{width:clamp(44px,10vw,56px);height:clamp(44px,10vw,56px);display:block}
.wm{font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:-.04em;margin:10px 0 4px}
.sub{margin:0;color:var(--ink2);font-size:clamp(14px,3.4vw,16px)}

/* ── 로그인 ── */
.card{background:var(--card);border-radius:28px;padding:clamp(22px,5vw,36px) clamp(18px,5vw,34px);width:100%;max-width:440px;box-shadow:0 1px 0 rgba(23,32,58,.04),0 24px 48px -24px rgba(23,32,58,.28);text-align:center}
.dots{display:flex;gap:clamp(10px,3vw,16px);justify-content:center;margin:clamp(16px,4vw,24px) 0}
.dots i{width:clamp(14px,3.4vw,18px);height:clamp(14px,3.4vw,18px);border-radius:50%;background:var(--line);transition:background .12s,transform .12s}
.dots i.f{background:var(--ink);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,12px)}
.pad button{font-size:clamp(22px,5.4vw,28px);font-weight:700;padding:clamp(12px,3vw,17px) 0;border-radius:16px;background:var(--line2);transition:background .08s,transform .08s}
.pad button:active{background:#DCE4FA;transform:scale(.96)}
.pad .fn{font-size:clamp(14px,3.4vw,16px);font-weight:600;color:var(--ink2);background:transparent}
.err{min-height:22px;margin-top:12px;color:var(--red);font-weight:700;font-size:15px}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ── 점검 화면 ── */
#sMain{justify-content:flex-start;align-items:center}
.wrap{width:100%;max-width:680px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:clamp(14px,3.4vw,22px)}
.hello{font-size:clamp(26px,6.4vw,38px);font-weight:800;letter-spacing:-.045em;line-height:1.15}
.hello small{display:block;margin-top:6px;font-size:clamp(13px,3vw,15px);font-weight:500;letter-spacing:-.01em;color:var(--ink2)}
.out{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;padding:9px 12px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}
.out:active{background:var(--line2)}
.segs{display:flex;gap:6px;margin-bottom:8px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.segcap{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:clamp(14px,3.4vw,20px);font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:clamp(10px,2.4vw,14px)}

.bk{position:relative;display:flex;align-items:center;gap:clamp(12px,3vw,18px);width:100%;text-align:left;background:var(--card);border-radius:20px;padding:clamp(16px,3.6vw,24px) clamp(14px,3vw,22px) clamp(16px,3.6vw,24px) clamp(22px,4.4vw,30px);border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 0 rgba(23,32,58,.03),0 14px 28px -20px rgba(23,32,58,.35);transition:transform .1s}
.bk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--c)}
.bk:active:not(:disabled){transform:scale(.985)}
.bk .tx{flex:1;min-width:0}
.bk .nm{display:block;font-size:clamp(20px,5vw,28px);font-weight:800;letter-spacing:-.04em;line-height:1.15}
.bk .st{display:block;margin-top:4px;font-size:clamp(12.5px,2.9vw,15px);color:var(--ink2);font-weight:500}
.ind{flex:none;width:clamp(40px,9vw,52px);height:clamp(40px,9vw,52px);border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--ink3)}
.ind svg{width:55%;height:55%}
.bk.wait{border-color:#F1C877;background:#FFFBF1}
.bk.wait .st{color:#9A6400}
.bk.wait .ind{border-color:var(--amber);color:var(--amber);border-top-color:transparent;animation:spin 1.1s linear infinite}
.bk.wait .ind svg{animation:spin 1.1s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bk.call{background:var(--go);border-color:var(--go);color:#fff;animation:glow 1.3s ease-in-out infinite}
.bk.call::before{background:rgba(255,255,255,.35)}
.bk.call .st{color:rgba(255,255,255,.92);font-weight:600}
.bk.call .ind{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.14)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(14,159,110,.5)}50%{box-shadow:0 0 0 10px rgba(14,159,110,0)}}
.bk.done{background:transparent;box-shadow:none;border-style:dashed}
.bk.done::before{opacity:.35}
.bk.done .nm{color:var(--ink3)}
.bk.done .st{color:var(--ink3)}
.bk.done .ind{background:var(--teal);border-color:var(--teal);color:#fff}
.cx{flex:none;font-size:13px;font-weight:700;color:#9A6400;background:#fff;border:1px solid #F1C877;border-radius:10px;padding:7px 11px}
.hint{margin-top:18px;color:var(--ink2);font-size:15px;text-align:center}

/* ── 호출 알림 ── */
#call{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:clamp(18px,5vw,40px);color:#fff;background:radial-gradient(120% 90% at 50% 0%,#24336A 0%,var(--ink) 60%)}
#call.on{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.rings{position:relative;width:clamp(110px,26vw,170px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:clamp(18px,5vw,34px)}
.rings::before,.rings::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ripple 2s ease-out infinite}
.rings::after{animation-delay:1s}
@keyframes ripple{from{transform:scale(.7);opacity:.9}to{transform:scale(1.6);opacity:0}}
.rings .core{width:68%;aspect-ratio:1;border-radius:50%;background:var(--go);display:grid;place-items:center;box-shadow:0 12px 32px -8px rgba(14,159,110,.7)}
.rings svg{width:46%;height:46%;transform-origin:50% 12%;animation:swing .7s ease-in-out 3}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(16deg)}75%{transform:rotate(-16deg)}}
#call h2{margin:0;font-size:clamp(30px,8.4vw,58px);font-weight:800;letter-spacing:-.05em;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:8px;margin:clamp(16px,4vw,26px) 0 clamp(22px,6vw,40px);padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.12);font-size:clamp(16px,4vw,22px);font-weight:700}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,#7CE3BD)}
#call .ok{background:#fff;color:var(--ink);font-size:clamp(18px,4.6vw,24px);font-weight:800;padding:clamp(14px,3.4vw,20px) clamp(36px,9vw,64px);border-radius:999px;box-shadow:0 18px 36px -14px rgba(0,0,0,.6)}
#call .ok:active{transform:scale(.97)}

/* ── 완료 ── */
#sDone{text-align:center;background:radial-gradient(120% 90% at 50% 0%,#DDF5EE 0%,var(--bg) 62%)}
.seal{width:clamp(110px,28vw,160px);height:clamp(110px,28vw,160px)}
.seal circle{fill:none;stroke:var(--teal);stroke-width:5;stroke-dasharray:302;stroke-dashoffset:302;animation:draw .7s ease-out forwards}
.seal path{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#sDone h2{margin:clamp(16px,4vw,26px) 0 6px;font-size:clamp(28px,7.4vw,44px);font-weight:800;letter-spacing:-.05em}
#sDone p{margin:0 0 clamp(18px,5vw,30px);font-size:clamp(15px,3.6vw,19px);color:var(--ink2)}
#sDone button{background:var(--ink);color:#fff;font-size:clamp(16px,4vw,20px);font-weight:700;padding:14px 38px;border-radius:999px}

/* ── 설정/토스트 ── */
.setup{text-align:left}
.setup input{width:100%;margin:6px 0;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:var(--font);user-select:text;-webkit-user-select:text}
.setup button{margin-top:10px;width:100%;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-size:17px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#17203A"/><g fill="none" stroke-width="34" stroke-linecap="round" transform="translate(256 262) scale(.86) translate(-262 -262)">
<path d="M153 229A58 58 0 1 0 153 311" stroke="#fff"/>
<circle cx="268" cy="270" r="58" stroke="#fff"/>
<path d="M326 214V328" stroke="#fff"/>
<path d="M388 150V328" stroke="#fff"/>
<path d="M448 150V328" stroke="#2DD4BF"/>
<path d="M472 128a40 40 0 0 1 22 30" stroke="#2DD4BF" stroke-width="22"/>
<path d="M480 96a76 76 0 0 1 40 56" stroke="#2DD4BF" stroke-width="22" opacity=".55"/>
</g></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3.6c0 .6-.2 1.2-.6 1.7L4 16.2c-.5.7 0 1.8.9 1.8h14.2c.9 0 1.4-1.1.9-1.8l-1.4-1.9c-.4-.5-.6-1.1-.6-1.7V9a6 6 0 0 0-6-6Z" fill="#fff"/><path d="M9.8 19.5a2.3 2.3 0 0 0 4.4 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H7a2 2 0 0 0-2 2V4.5Z M7 18h12v3H7a2 2 0 0 1 0-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M12 4v8m0 0-3.5-3.5M12 12l3.5-3.5M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- Firebase 설정 (처음 한 번만) -->
<div class="screen" id="sSetup">
  <div class="card setup">
    <div style="text-align:center"><svg class="mark" style="margin:0 auto"><use href="#i-mark"/></svg><div class="wm">처음 한 번만 설정</div><p class="sub">학생관리앱과 같은 Firebase 정보를 입력하세요</p></div>
    <input id="c-apiKey" placeholder="apiKey">
    <input id="c-authDomain" placeholder="authDomain">
    <input id="c-projectId" placeholder="projectId">
    <input id="c-storageBucket" placeholder="storageBucket">
    <button onclick="saveCfg()">저장하고 시작</button>
  </div>
</div>

<!-- 로그인 -->
<div class="screen" id="sLogin">
  <div class="card" id="loginCard">
    <svg class="mark" style="margin:0 auto"><use href="#i-mark"/></svg>
    <div class="wm">체크콜</div>
    <p class="sub">내 번호 5자리를 눌러 주세요</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>

<!-- 점검 -->
<div class="screen" id="sMain">
  <div class="wrap">
    <div class="top">
      <div class="hello"><span id="hName"></span><small>검사받을 교재를 누르면 선생님께 알려요</small></div>
      <button class="out" onclick="logout()">나가기</button>
    </div>
    <div class="segs" id="segs"></div>
    <div class="segcap"><span>오늘 점검</span><span id="barTxt">0/0</span></div>
    <div class="list" id="grid"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<!-- 완료 -->
<div class="screen" id="sDone">
  <svg class="seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" transform="rotate(-90 50 50)"/><path d="M30 52l14 14 27-30"/></svg>
  <h2 id="dName"></h2>
  <p>오늘 교재 점검을 모두 마쳤어요.</p>
  <button onclick="logout()">확인</button>
</div>

<!-- 호출 -->
<div id="call" role="alertdialog" aria-live="assertive">
  <div class="rings"><div class="core"><svg><use href="#i-bell"/></svg></div></div>
  <h2 id="callWho"></h2>
  <div class="chip" id="callChip"><i></i><b id="callItem"></b></div>
  <button class="ok" onclick="ackCall()">알겠어요, 갈게요</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var $=function(i){return document.getElementById(i);};
var db=null;
var S=null;               // {sid,name,items}
var checks={};            // item -> doc data (+id)
var unsub=null, pin='', busy=false;
var AC=null, ringTimers=[], shownCall={}, idleTimer=null;
var COLORS=['#3E63DD','#12A594','#8E4EC6','#E5960B','#E5484D'];

function todayISO(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function safeId(s){return String(s).replace(/[^\w가-힣]/g,'_');}
function show(id){['sSetup','sLogin','sMain','sDone'].forEach(function(s){$(s).classList.toggle('on',s===id);});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ico(id){return '<svg><use href="#i-'+id+'"/></svg>';}

/* ── 시작 ── */
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function ensureFirebase(){
  if(window.firebase&&firebase.firestore)return true;
  var bases=['https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/','https://cdn.jsdelivr.net/npm/firebase@10.12.2/'];
  for(var i=0;i<bases.length;i++){
    try{await loadScript(bases[i]+'firebase-app-compat.js');await loadScript(bases[i]+'firebase-firestore-compat.js');if(window.firebase&&firebase.firestore)return true;}catch(e){}
  }
  return false;
}
async function boot(){
  if(!(await ensureFirebase())){document.body.innerHTML='<div style="padding:40px;text-align:center;font-size:19px;color:#334155;line-height:1.6">Firebase를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.<br><small style="color:#8B93A7">광고·콘텐츠 차단 설정이 gstatic.com을 막고 있을 수도 있어요.</small></div>';return;}
  var cfg=null;try{cfg=JSON.parse(localStorage.getItem('fb_cfg'));}catch(e){}
  if(!cfg||!cfg.apiKey||!cfg.projectId){show('sSetup');return;}
  try{firebase.app();}catch(e){firebase.initializeApp(cfg);}
  db=firebase.firestore();
  buildPad();paintDots();
  var sid=null;try{sid=sessionStorage.getItem('cc_sid');}catch(e){}
  if(sid){resume(sid);}else{show('sLogin');}
}
function saveCfg(){
  var cfg={apiKey:$('c-apiKey').value.trim(),authDomain:$('c-authDomain').value.trim(),projectId:$('c-projectId').value.trim(),storageBucket:$('c-storageBucket').value.trim()};
  if(!cfg.apiKey||!cfg.projectId){toast('apiKey와 projectId를 입력하세요');return;}
  localStorage.setItem('fb_cfg',JSON.stringify(cfg));location.reload();
}

/* ── 로그인 ── */
function buildPad(){
  var h='';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="key('+n+')">'+n+'</button>';});
  h+='<button class="fn" onclick="clr()">지우기</button><button onclick="key(0)">0</button><button class="fn" onclick="back()" aria-label="한 칸 지우기">←</button>';
  $('pad').innerHTML=h;
}
function paintDots(){var h='';for(var i=0;i<5;i++)h+='<i class="'+(i<pin.length?'f':'')+'"></i>';$('dots').innerHTML=h;}
function key(n){initAudio();if(busy)return;if(pin.length<5){pin+=n;paintDots();}if(pin.length===5)tryLogin();}
function back(){pin=pin.slice(0,-1);paintDots();$('err').textContent='';}
function clr(){pin='';paintDots();$('err').textContent='';}
function fail(msg){
  $('err').textContent=msg;var c=$('loginCard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  pin='';paintDots();busy=false;
}
async function tryLogin(){
  if(pin.length!==5){fail('번호 5자리를 눌러 주세요');return;}
  busy=true;$('err').textContent='';
  try{
    var snap=await db.collection('checkRoster').where('pin','==',pin).get();
    if(snap.empty){fail('없는 번호예요. 다시 눌러 주세요');return;}
    var d=snap.docs[0];
    startSession(d.id,d.data());
  }catch(e){console.error(e);fail('연결이 불안정해요. 잠시 후 다시 눌러 주세요');}
  busy=false;
}
async function resume(sid){
  try{
    var d=await db.collection('checkRoster').doc(sid).get();
    if(d.exists){startSession(sid,d.data());return;}
  }catch(e){}
  try{sessionStorage.removeItem('cc_sid');}catch(e){}
  show('sLogin');
}

/* ── 세션 ── */
function startSession(sid,data){
  S={sid:sid,name:data.name,items:(data.items||[]).slice()};
  try{sessionStorage.setItem('cc_sid',sid);}catch(e){}
  shownCall={};checks={};
  $('hName').textContent=S.name+' 안녕';
  pin='';paintDots();
  if(unsub)unsub();
  unsub=db.collection('bookChecks').where('studentId','==',sid).where('date','==',todayISO()).onSnapshot(function(snap){
    checks={};
    snap.forEach(function(d){var x=d.data();x.id=d.id;checks[x.item]=x;});
    render();
  },function(e){console.error(e);toast('연결이 끊겼어요. 잠시만 기다려 주세요');});
  show('sMain');render();bumpIdle();
}
function logout(){
  if(unsub){unsub();unsub=null;}
  S=null;checks={};stopRing();$('call').classList.remove('on');
  clearTimeout(idleTimer);
  try{sessionStorage.removeItem('cc_sid');}catch(e){}
  pin='';paintDots();$('err').textContent='';
  show('sLogin');
}
// 대기·호출 중인 교재가 없으면 90초 뒤 자동으로 나가요 (다음 학생이 쓸 수 있게)
function bumpIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){
    var active=S&&Object.keys(checks).some(function(k){return checks[k].status!=='done';});
    if(active){bumpIdle();}else{logout();}
  },90000);
}
document.addEventListener('touchstart',function(){if(S)bumpIdle();},{passive:true});
document.addEventListener('mousedown',function(){if(S)bumpIdle();});

/* ── 화면 그리기 ── */
function render(){
  if(!S)return;
  var total=S.items.length,done=0,html='',segs='',anyCall=null;
  S.items.forEach(function(it,i){
    var c=checks[it],st=c?c.status:'none',col=COLORS[i%COLORS.length];
    if(st==='done')done++;
    var cls='bk',icon=ico('book'),label='',cancel='';
    if(st==='waiting'){cls+=' wait';icon=ico('dots');label='선생님께 알렸어요. 잠시만 기다려요';cancel='<span class="cx" role="button" onclick="event.stopPropagation();cancelReq('+i+')">취소</span>';}
    else if(st==='called'){cls+=' call';icon='<svg><use href="#i-bell"/></svg>';label=esc(c.calledBy||'선생님')+' 선생님께 가세요';}
    else if(st==='done'){cls+=' done';icon=ico('check');label='검사 끝';}
    else{label='눌러서 선생님 부르기';}
    html+='<button class="'+cls+'" style="--c:'+col+'" '+(st==='done'||st==='called'?'disabled ':'')+'onclick="request('+i+')">'
      +'<span class="tx"><span class="nm">'+esc(it)+'</span><span class="st">'+label+'</span></span>'+cancel
      +'<span class="ind">'+icon+'</span></button>';
    segs+='<i style="background:'+(st==='done'?col:'')+'"></i>';
    if(st==='called'&&!anyCall){anyCall=c;anyCall._col=col;}
  });
  $('grid').innerHTML=html;$('segs').innerHTML=segs;
  $('barTxt').textContent=done+'/'+total;
  $('hint').textContent=total?'':'오늘 점검할 교재가 아직 없어요. 선생님께 말씀드려 주세요.';
  // 호출 오버레이 (선생님이 호출할 때마다 한 번씩, 벨은 두 번)
  if(anyCall){
    var stamp=anyCall.calledAt&&anyCall.calledAt.toMillis?anyCall.calledAt.toMillis():0;
    if(stamp&&shownCall[anyCall.id]!==stamp){shownCall[anyCall.id]=stamp;openCall(anyCall);}
  }else if($('call').classList.contains('on')){closeCall();}
  // 전부 완료
  if(total&&done===total&&!S.finished){S.finished=true;finishAll();}
}
function finishAll(){
  $('dName').textContent=S.name+', 수고했어요';
  show('sDone');
  clearTimeout(idleTimer);idleTimer=setTimeout(logout,12000);
}

/* ── 요청 / 취소 ── */
async function request(i){
  initAudio();
  var it=S.items[i],c=checks[it];
  if(c&&c.status!=='none')return;
  var ref=db.collection('bookChecks').doc(todayISO()+'_'+S.sid+'_'+safeId(it));
  try{
    await ref.set({date:todayISO(),studentId:S.sid,studentName:S.name,item:it,status:'waiting',requestedAt:firebase.firestore.FieldValue.serverTimestamp()});
    toast('선생님께 알렸어요');
  }catch(e){console.error(e);toast('보내지 못했어요. 다시 눌러 주세요');}
}
async function cancelReq(i){
  var it=S.items[i],c=checks[it];if(!c||c.status!=='waiting')return;
  if(!confirm('"'+it+'" 요청을 취소할까요?'))return;
  try{await db.collection('bookChecks').doc(c.id).delete();}catch(e){toast('취소하지 못했어요');}
}

/* ── 호출 알림: 벨은 2번만 ── */
function initAudio(){
  try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}
}
function ding(){
  if(AC){
    try{[880,1175,1568].forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.16;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.4);});}catch(e){}
  }
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function openCall(c){
  $('callWho').textContent=(c.calledBy||'선생님')+' 선생님이 불러요';
  $('callItem').textContent=c.item+' 검사';
  $('callChip').style.setProperty('--c','#7CE3BD');
  $('call').classList.add('on');
  stopRing();ding();ringTimers.push(setTimeout(ding,1500));   // 총 2번
}
function stopRing(){ringTimers.forEach(clearTimeout);ringTimers=[];}
function closeCall(){stopRing();$('call').classList.remove('on');}
async function ackCall(){
  closeCall();
  Object.keys(checks).forEach(function(k){
    var c=checks[k];
    if(c.status==='called')db.collection('bookChecks').doc(c.id).update({ackAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
  });
}

window.addEventListener('load',boot);
</script>
</body>
