<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{--ink:#14302B;--ink2:#51675F;--ink3:#8A9C95;--bg:#EEF4F0;--card:#fff;--line:#D8E4DD;--line2:#EAF1EC;--g:#0F9D7A;--g2:#0F5C4D;--amber:#E5960B;--red:#E5484D;
--font:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.screen{display:none;min-height:100%;padding:clamp(14px,4vw,32px);align-items:center;justify-content:center;flex-direction:column}
.screen.on{display:flex}
.mark{width:clamp(48px,11vw,60px);height:clamp(48px,11vw,60px);display:block}
.wm{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.04em;margin:10px 0 4px}
.sub{margin:0;color:var(--ink2);font-size:clamp(14px,3.6vw,16px)}
.card{background:var(--card);border-radius:28px;padding:clamp(22px,5vw,36px) clamp(18px,5vw,34px);width:100%;max-width:440px;box-shadow:0 24px 48px -24px rgba(15,60,50,.3);text-align:center}
.card.setup input{display:block;width:100%;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;user-select:text;-webkit-user-select:text}
.card.setup button{width:100%;margin-top:8px;padding:14px;border-radius:14px;background:var(--g2);color:#fff;font-weight:700;font-size:16px}
.dots{display:flex;gap:clamp(10px,3vw,16px);justify-content:center;margin:clamp(16px,4vw,24px) 0}
.dots i{width:clamp(14px,3.4vw,18px);height:clamp(14px,3.4vw,18px);border-radius:50%;background:var(--line);transition:.12s}
.dots i.f{background:var(--g2);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,12px)}
.pad button{font-size:clamp(22px,5.4vw,28px);font-weight:700;padding:clamp(12px,3vw,17px) 0;border-radius:16px;background:var(--line2)}
.pad button:active{background:#CDE8DD;transform:scale(.96)}
.pad .fn{font-size:clamp(14px,3.4vw,16px);font-weight:600;color:var(--ink2);background:transparent}
.err{min-height:22px;margin-top:12px;color:var(--red);font-weight:700;font-size:15px}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.inst{margin-top:16px;padding:12px 14px;border-radius:16px;background:#E6F5EE;color:#0F3D33;font-size:clamp(13px,3.2vw,15px);line-height:1.55;text-align:left;display:none}
.inst b{display:block;margin-bottom:2px}
.inst .ib{display:flex;gap:8px;margin-top:8px}
.inst button{border-radius:10px;padding:9px 14px;font-size:clamp(13px,3.2vw,15px);font-weight:700;background:#fff;color:#0F3D33;box-shadow:0 0 0 1px #B5DCCB}
.inst button.pri{background:var(--g2);color:#fff;box-shadow:none}
/* 체크 화면 */
#sMain{justify-content:flex-start;align-items:center}
.wrap{width:100%;max-width:640px;padding-bottom:40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top>div{flex:1;min-width:0}
.hello{font-size:clamp(17px,4.4vw,21px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.dt{margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink2)}
.lv{background:var(--g2);color:#fff;border-radius:8px;padding:2px 9px;font-weight:700;font-size:13px}
.outw{text-align:center;margin:18px 0 6px}
.out{background:#fff;border-radius:12px;padding:11px 28px;font-weight:700;font-size:14px;color:var(--ink2);box-shadow:0 0 0 1px var(--line)}
.prog{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.prog .t{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:8px}
.bar{height:12px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34D3A6,var(--g));border-radius:99px;transition:width .3s}
.notice{background:#FFF6E0;border-radius:16px;margin-bottom:12px;overflow:hidden}
.notice summary{padding:12px 16px;font-weight:800;font-size:15px;color:#7A4B00;cursor:pointer;list-style:none}
.notice summary::-webkit-details-marker{display:none}
.notice div{padding:0 16px 14px;font-size:14px;line-height:1.7;color:#5C4510;white-space:pre-wrap}
.sec{background:#fff;border-radius:20px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.sh{padding:12px 16px;background:var(--g2);color:#fff;font-weight:800;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sh small{font-weight:600;opacity:.85;font-size:13px}
.sh .cn{font-size:13px;font-weight:700;opacity:.9;white-space:nowrap}
.it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;background:#fff;border-top:1px solid var(--line2);font-size:clamp(16px,4.2vw,18px);font-weight:600;line-height:1.35}
.it:first-of-type{border-top:0}
.it:active{background:#F2F8F5}
.cb{flex:none;width:30px;height:30px;border-radius:9px;border:2.5px solid #B9CBC2;display:flex;align-items:center;justify-content:center;color:#fff;transition:.12s}
.cb svg{width:20px;height:20px;opacity:0}
.it.on .cb{background:var(--g);border-color:var(--g)}.it.on .cb svg{opacity:1}
.it.on .tx{color:var(--ink3);text-decoration:line-through;text-decoration-color:#B9CBC2}
.tx{flex:1;min-width:0}.tx em{display:block;font-style:normal;font-weight:500;font-size:13px;color:var(--ink3);margin-top:2px;text-decoration:none}
.vd{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:#E8EEFC;color:#3E63DD}
.empty{background:#fff;border-radius:20px;padding:36px 20px;text-align:center;color:var(--ink2);line-height:1.8;font-size:16px}
.allok{background:var(--g2);color:#fff;border-radius:18px;padding:16px;text-align:center;font-weight:800;font-size:17px;margin-bottom:12px;display:none}
/* 사진 숙제 */
.itp{border-top:1px solid var(--line2);background:#fff}.itp:first-of-type{border-top:0}
.it0{display:flex;align-items:center;gap:14px;padding:15px 16px 8px;font-size:clamp(16px,4.2vw,18px);font-weight:600;line-height:1.35}
.itp.on .cb{background:var(--g);border-color:var(--g)}.itp.on .cb svg{opacity:1}
.ph{display:flex;flex-wrap:wrap;gap:10px;padding:2px 16px 14px}
.it0{padding-bottom:12px}.it0+.ph{padding-top:0}
.pc{position:relative;width:84px;border-radius:12px;background:var(--line2);text-align:center;padding:4px 4px 6px;font-size:11px}
.pc img{width:100%;height:68px;object-fit:cover;border-radius:8px;display:block}
.pc .pi{display:flex;height:68px;align-items:center;justify-content:center;font-size:26px}
.pc small{display:block;margin-top:3px;font-weight:700;color:var(--g2);line-height:1.25}
.pc.re{background:#FDECEC}.pc.re small{color:var(--red)}.pc.ok small{color:#3E63DD}
.pd{display:block;width:100%;margin-top:5px;padding:5px 0;border-radius:8px;background:#fff;color:var(--red);font-weight:800;font-size:12px;box-shadow:0 0 0 1px #F3C4C6}.pd:active{background:#FDECEC}
.pbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:12px;background:#FDEBF3;color:#C2417A;font-weight:700;font-size:clamp(13px,3.5vw,15px);line-height:1.2;cursor:pointer;white-space:nowrap}
.pbtn:active{background:#F8D3E3}.pbtn.off{background:var(--line2);color:var(--ink3);cursor:default}
.pbtn input{display:none}
.vr{position:fixed;inset:0;z-index:20;background:#0b1512;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#fff}
.vr.on{display:flex}
.vr video{width:100%;max-width:560px;max-height:62vh;background:#000;border-radius:14px;object-fit:contain}
.vr .vt{font-size:15px;font-weight:700;margin:10px 0 4px;text-align:center}
.vr .vs{font-size:13px;color:#B9CBC2;text-align:center;min-height:18px}
.vr .vb{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.vr .vb button{padding:13px 22px;border-radius:14px;font-size:16px;font-weight:800;background:#fff;color:#14302B}
.vr .vb button.rec{background:var(--red);color:#fff}.vr .vb button.pri{background:var(--g);color:#fff}
.tmb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#F2F8F5;border-bottom:1px solid var(--line2)}
.tmb .tv{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;margin-right:auto;color:var(--g2)}
.tmb .tv.ps{color:var(--amber)}
.tmb button{padding:8px 16px;border-radius:12px;font-weight:800;font-size:14px;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink)}
.tmb button.go{background:var(--g2);color:#fff;box-shadow:none}.tmb button.pz{background:#FFF1D6;color:#7A4B00;box-shadow:none}
.net{position:sticky;top:0;z-index:8;display:none;margin:0 0 10px;padding:10px 14px;border-radius:12px;background:#FDECEC;color:#B3262B;font-weight:800;font-size:14px;text-align:center;box-shadow:0 0 0 1px #F3C4C6}
.net.on{display:block}.net.ok{background:#E6F5EE;color:#0F5C4D;box-shadow:0 0 0 1px #B5DCCB}
.dlg{position:fixed;inset:0;z-index:30;background:rgba(10,25,20,.55);display:none;align-items:center;justify-content:center;padding:20px}
.dlg.on{display:flex}
.dlg div.bx{background:#fff;border-radius:20px;padding:22px 20px 16px;max-width:320px;width:100%;text-align:center}
.dlg .dt2{font-weight:800;font-size:17px;line-height:1.4;margin-bottom:16px}
.dlg .db{display:flex;gap:10px}.dlg .db button{flex:1;padding:13px 0;border-radius:14px;font-weight:800;font-size:15px;background:var(--line2)}
.dlg .db button.dn{background:var(--red);color:#fff}
.cel{position:fixed;inset:0;z-index:40;background:rgba(10,40,32,.95);display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;color:#fff;text-align:center;padding:24px}
.cel.on{display:flex}
.cel .em{font-size:96px;line-height:1;animation:celpop .8s cubic-bezier(.2,1.6,.4,1) both}
.cel .ct{word-break:keep-all;font-size:clamp(22px,6vw,28px);font-weight:800;margin-top:14px;letter-spacing:-.03em;animation:celup .5s .25s both}
.cel .cs{word-break:keep-all;text-align:center;font-size:15px;opacity:.9;margin-top:8px;animation:celup .5s .45s both}
.cel .cb2{margin-top:22px;padding:13px 34px;border-radius:14px;background:#fff;color:var(--g2);font-weight:800;font-size:16px;animation:celup .5s .65s both}
.cel i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:celfall linear forwards}
@keyframes celpop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes celup{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes celfall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cel *{animation:none!important}.cel i{display:none}}

/* 레이싱 보드 */
.race{background:linear-gradient(180deg,#DFF5EA,#C9EBDD);border-radius:22px;padding:12px 12px 14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.race .rt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:15px;margin-bottom:6px}
.race .rt small{font-weight:700;font-size:12px;color:var(--ink2)}
.race .fl{background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;color:#C2410C;box-shadow:0 2px 0 #F5D5B8}
.rb{position:relative;line-height:0}
.rbd{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(15,60,50,.25))}
.rtk{position:absolute;z-index:3;transition:left .6s cubic-bezier(.3,1.2,.5,1),top .6s cubic-bezier(.3,1.2,.5,1);cursor:pointer}
.rtk img{width:100%;display:block;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3));pointer-events:none}
.rtk.hop img{animation:rhop .6s ease-out}
.mtk{position:absolute;z-index:2;pointer-events:none;transition:left .6s,top .6s}
.mtk img{width:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));opacity:.92}
.mtk b{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);white-space:nowrap;font-size:10px;line-height:1.3;font-weight:800;background:rgba(255,255,255,.92);color:#0F5C4D;border-radius:99px;padding:1px 7px}
.rcm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;line-height:1.2}
.rcm span{background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:#0F5C4D}
.rcm i{font-style:normal;color:var(--ink2);font-weight:600}
.cel .scn{width:min(100%,520px);margin:12px auto 0;background:rgba(255,255,255,.1);border-radius:20px;padding:6px}
@keyframes rhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-34%) scale(1.1)}}
.rfin{margin-top:10px;background:#FFF3B0;border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px;color:#6B4300;text-align:center;line-height:1.5}
.rfin button{margin-top:8px;padding:9px 20px;border-radius:12px;background:#0F5C4D;color:#fff;font-weight:800;font-size:14px}
.rbtn{display:inline-block;margin-top:8px;padding:9px 16px;border-radius:12px;background:#fff;color:#0F5C4D;font-weight:800;font-size:14px;box-shadow:0 0 0 1px #D9A400;cursor:pointer}
.rch{background:none;padding:0;border:none}
.pk .bx{max-width:360px}
.pk .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pk .gr button{padding:8px 0 6px!important;font-size:12px!important;display:flex;flex-direction:column;align-items:center;gap:4px}
.pk .gr img{height:64px;width:auto;max-width:100%;object-fit:contain}
.pk .bx{max-width:380px!important}
.pk .gr button{background:linear-gradient(180deg,#fff,#EAF3EE);border-radius:16px;padding:10px 0 8px;font-weight:800;font-size:14px;box-shadow:0 4px 0 #AFC9BC}
.pk .gr button.on{background:linear-gradient(180deg,#FFF3B0,#FFD84D);box-shadow:0 4px 0 #D9A400}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#14302B;color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;display:none;z-index:9;max-width:90vw}
</style>
</head>

<script>
var $=function(i){return document.getElementById(i);};
var db=null,S=null,R=null,LOG={e:{}},pin='',busy=false,unsubR=null,unsubL=null,logKey='',saveT=null,pendingE=null;
/* 사진 숙제: 숙제 전용 버킷을 만들면 이름만 여기에 적어요 (비워 두면 기본 저장 공간) */
var HW_BUCKET='daily-report-5a26e-hw';var MAXP=5;var MAXV=2,VSEC=180,VMB=50;var authErr='';
var UPL={},LP={},UPB={},UPP={},unsubU=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function show(id){['sSetup','sLogin','sMain'].forEach(function(s){$(s).classList.toggle('on',s===id);});}
var _tt=null;function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(function(){t.style.display='none';},2600);}

/* ── 레이싱 보드: 숙제를 완벽하게 한 날 1칸 전진, 한 바퀴 돌아 출발 칸에 도착! ── */
var RN=12;  /* 칸 수: 말판 그림의 칸 11개 + 출발 칸으로 돌아오면 도착 */
var RPT=[[50.4, 71.0], [38.8, 62.9], [31.1, 55.2], [24.8, 47.2], [33.2, 36.5], [40.9, 30.1], [52.1, 25.8], [61.6, 30.6], [70.0, 38.1], [78.4, 47.7], [70.7, 57.3], [63.0, 64.8]]; /* 말판 그림 위 칸 중심 (가로%, 세로%) — 0=출발 */
var IMGD='homecheck-img/';
var CHS=[{f:'ch1',n:'탐험가',w:15,o:88},{f:'ch2',n:'사진가',w:12.5,o:88},{f:'ch3',n:'닥터',w:12,o:88},{f:'ch4',n:'요리사',w:14,o:88},
  {f:'ch5',n:'스타 카',w:19,o:62},{f:'ch6',n:'1등 카',w:19,o:62},{f:'ch7',n:'멍멍 카',w:19,o:62},{f:'ch8',n:'번개 카',w:19,o:62}];
var RACE={ch:-1,pos:0,round:1,days:[],fin:0,loaded:false,prz:{},ev:0,fr:{},cm:{}},RS_shown=0;
function chOk(i){var s=(R&&R.cs)||'all';if(i==null||i<0||i>=CHS.length)return false;return s==='cars'?i>=4:(s==='people'?i<4:true);}
function chList(){var a=[];CHS.forEach(function(c,i){if(chOk(i))a.push(i);});return a;}
var _pkAuto=false;
function chImg(i,css){var c=CHS[i];if(!c)return '';return '<img src="'+IMGD+c.f+'.webp" alt="'+c.n+'" draggable="false" style="'+(css||'')+'">';}
function rkey(){return 'hc_race_'+S;}
async function raceLoad(){
  RACE={ch:-1,pos:0,round:1,days:[],fin:0,loaded:false,prz:{},ev:0,fr:{},cm:{}};RS_shown=0;
  var loc=null;try{loc=JSON.parse(localStorage.getItem(rkey())||'null');}catch(e){}
  var rem=null;try{var d=await db.collection('homeRace').doc(S).get();rem=d.exists?d.data():null;}catch(e){console.warn('[레이싱] 불러오기 실패',e);}
  var src=(rem&&(!loc||(rem.upd||0)>=(loc.upd||0)))?rem:loc;
  if(src){RACE={ch:(src.ch==null||src.ch>=CHS.length)?-1:src.ch,pos:Math.min(RN,src.pos||0),round:src.round||1,days:src.days||[],fin:src.fin||0,loaded:true,prz:(rem&&rem.prz)||{},ev:0,fr:(rem&&rem.fr)||{},cm:{}};}
  else RACE.loaded=true;
  if(RACE.pos>=RN&&!RACE.fin)RACE.fin=Date.now();

}
function raceSave(){
  var o={sid:S,name:(R&&R.name)||'',ch:RACE.ch,pos:RACE.pos,round:RACE.round,days:RACE.days.slice(-90),fin:RACE.fin||0,upd:Date.now()};
  try{localStorage.setItem(rkey(),JSON.stringify(o));}catch(e){}
  try{db.collection('homeRace').doc(S).set(o,{merge:true}).catch(function(e){console.warn('[레이싱] 저장 실패',e);});}catch(e){}
  try{if(R&&R.cid){var cu={cid:R.cid,upd:o.upd,m:{}};cu.m[S]={n:o.name,ch:o.ch,pos:o.pos,round:o.round,fin:o.fin,upd:o.upd};db.collection('homeRace').doc('class__'+R.cid).set(cu,{merge:true}).catch(function(e){console.warn('[레이싱] 반 기록 실패',e);});}}catch(e){}
}
/* ── 같은 반 친구: 반 문서 하나(읽기 1번)에서 친구들의 최종 위치만 가져와요 ── */
async function raceClassLoad(){
  RACE.cm={};if(!(R&&R.cid&&R.mates&&R.mates.length))return;
  try{
    var d=await db.collection('homeRace').doc('class__'+R.cid).get(),m=(d.exists&&d.data().m)||{};
    R.mates.forEach(function(x){var e=m[x.id];RACE.cm[x.id]=(e&&e.ch!=null&&e.ch>=0)?{n:x.n,st:1,ch:e.ch,pos:Math.min(RN,e.pos||0),fin:e.fin||0}:{n:x.n,st:0};});
  }catch(e){console.warn('[레이싱] 반 불러오기 실패',e);}
}
/* 반에서 가장 먼저 도착한 학생에게 보너스: 반 문서에 '먼저 왔다'를 한 명만 적을 수 있게 트랜잭션으로 처리 */
async function raceClaim(){
  if(!RACE.fin||!(R&&R.cid&&R.mates&&R.mates.length))return 0;
  var rd=RACE.round;if(RACE.fr[rd]!==undefined)return RACE.fr[rd]?1:0;
  var ref=db.collection('homeRace').doc('class__'+R.cid),res=0;
  try{
    res=await db.runTransaction(function(t){return t.get(ref).then(function(d){
      var f=(d.exists&&d.data().first)||{};
      if(f[rd]&&f[rd].sid!==S)return 0;
      if(f[rd]&&f[rd].sid===S)return 1;
      var u={first:{}};u.first[rd]={sid:S,at:Date.now()};t.set(ref,u,{merge:true});return 1;
    });});
  }catch(e){console.warn('[레이싱] 1등 확인 실패',e);return -1;}
  RACE.fr[rd]=res;
  try{var u2={fr:{}};u2.fr[rd]=res;db.collection('homeRace').doc(S).set(u2,{merge:true}).catch(function(){});}catch(e){}
  return res;
}
function wkIdx(ymdS){var p=ymdS.split('-'),d=Date.UTC(+p[0],+p[1]-1,+p[2]);return Math.floor((d/86400000+3)/7);}
function raceStreak(){
  var set={};RACE.days.forEach(function(x){set[wkIdx(x)]=1;});
  var w=wkIdx(ymd()),n=0;if(!set[w])w--;
  while(set[w]){n++;w--;}return n;
}
function raceAdvance(){
  if(!RACE.loaded)return 0;var t=ymd();if(RACE.days.indexOf(t)>=0)return 0;
  RACE.days.push(t);var r=1;
  if(RACE.pos<RN&&!RACE.fin){RACE.pos++;if(RACE.pos>=RN){RACE.fin=Date.now();r=2;RACE.ev=0;}}else r=0;
  raceSave();return r;
}
function tokAt(n,ci,sc,dx){
  var p=RPT[n%RN]||RPT[0],c=CHS[(ci>=0&&ci<CHS.length)?ci:0];
  return 'left:'+(p[0]+(dx||0))+'%;top:'+(p[1]+1.5)+'%;width:'+(c.w*(sc||1)).toFixed(1)+'%;transform:translate(-50%,-'+c.o+'%)';
}
function myCh(){return chOk(RACE.ch)?RACE.ch:(chList()[0]||0);}
function tokStyle(n){return tokAt(n,myCh());}
function mateHtml(){
  var h='',i=0;
  Object.keys(RACE.cm||{}).forEach(function(id){var m=RACE.cm[id];if(!m.st)return;
    var dx=(i%2?1:-1)*(2+Math.floor(i/2)*1.5);i++;
    h+='<div class="mtk" style="'+tokAt(m.pos,m.ch,.8,dx)+'">'+chImg(CHS[m.ch]?m.ch:0)+'<b style="margin-top:'+((i-1)%2*11)+'px">'+esc(m.n)+'</b></div>';});
  return h;
}
function mateChips(){
  var ks=Object.keys(RACE.cm||{});if(!ks.length)return '';
  return '<div class="rcm">'+ks.map(function(id){var m=RACE.cm[id];return '<span>'+esc(m.n)+' '+(m.st?(m.fin?'🏁 도착':m.pos+'/'+RN+'칸'):'<i>시작 전</i>')+'</span>';}).join('')+'</div>';
}
function raceHtml(){
  if(!RACE.loaded)return '';
  var h='<div class="race"><div class="rt"><span>🏁 숙제 레이싱 <small>'+RACE.round+'번째 판</small></span><span>'+(raceStreak()?'<span class="fl">🔥 '+raceStreak()+'주 연속</span> ':'')+'<small>'+RACE.pos+' / '+RN+'칸</small></span></div>';
  h+='<div class="rb"><img class="rbd" src="'+IMGD+'board.webp" alt="말판" draggable="false">'+mateHtml();
  h+='<div class="rtk" id="rtk" style="'+tokStyle(RS_shown)+'" onclick="pkOpen()" title="캐릭터 바꾸기">'+chImg(myCh())+'</div></div>'+mateChips();
  if(RACE.fin){
    var pz=(RACE.prz||{})[RACE.round];
    h+='<div class="rfin">🏆 한 바퀴를 다 돌았어요!<br>'+(RACE.fr&&RACE.fr[RACE.round]===1?'🥇 우리 반에서 제일 먼저 도착! 보너스 선물이 있어요<br>':'')+(pz?'🎁 선물을 받았어요: <b>'+esc(pz.n)+'</b>':'숙제한 증거 사진을 올리면<br>선생님이 확인하고 선물을 줘요')+'<br>';
    if(!pz)h+='<label class="rbtn">'+(RACE.up?'올리는 중…':'📷 증거 사진 올리기 ('+(RACE.ev||0)+'/5)')+'<input type="file" accept="image/*" multiple style="display:none" onchange="raceEvPick(this)"></label><br>';
    h+=(pz?'<button onclick="raceNew()">새 판 시작</button>':'<div style="font-size:12px;font-weight:600;margin-top:6px">선물을 받은 뒤에 새 판을 시작할 수 있어요<br>(앱을 다시 열면 확인돼요)</div>')+'</div>';
  }
  return h+'</div>';
}
function raceMove(){
  if(RS_shown===RACE.pos)return;
  RS_shown=RACE.pos;var el=$('rtk');if(!el){render();return;}
  el.setAttribute('style',tokStyle(RS_shown));el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');
}
function raceLk(){return 'race__'+S;}
async function raceEvCount(){
  if(!RACE.fin)return;
  try{var q=await db.collection('homeUploads').where('lk','==',raceLk()).get();var n=0;q.forEach(function(d){if((d.data().itemId||'')==='race'+RACE.round)n++;});RACE.ev=n;render();}catch(e){console.warn('[증거 수]',e);}
}
async function raceEvPick(inp){
  var files=Array.prototype.slice.call(inp.files||[]);inp.value='';if(!files.length)return;
  var U=null;try{U=firebase.auth().currentUser;}catch(e){}
  if(!U){toast('로그인이 안 됐어요. 새로고침해 주세요');return;}
  var room=5-RACE.ev;if(room<=0){toast('증거 사진은 5장까지 올릴 수 있어요');return;}
  files=files.slice(0,room);RACE.up=true;render();var fails=0;
  for(var i=0;i<files.length;i++){
    try{
      var big=await shrink(files[i],1600,.8),sm=await shrink(files[i],240,.6),day=ymd(),base='hw/'+U.uid+'/'+safe(S)+'/'+day+'/race'+RACE.round+'_'+Date.now(),st=hwStorage();
      await st.ref(base+'.jpg').put(big.blob,{contentType:'image/jpeg'});
      try{await st.ref(base+'_t.jpg').put(sm.blob,{contentType:'image/jpeg'});}catch(e){}
      var exp=new Date();exp.setMonth(exp.getMonth()+6);
      await db.collection('homeUploads').add({uid:U.uid,sid:S,name:R.name||'',lk:raceLk(),key:'레이싱',les:RACE.round+'번째 판 도착',itemId:'race'+RACE.round,itemLabel:'🏁 레이싱 도착 증거',kind:'photo',
        path:base+'.jpg',thumb:base+'_t.jpg',bucket:HW_BUCKET||'',size:big.blob.size,w:big.w,h:big.h,status:'제출',day:day,at:Date.now(),exp:firebase.firestore.Timestamp.fromDate(exp)});
      RACE.ev++;
    }catch(e){fails++;console.error(e);}
  }
  RACE.up=false;render();
  if(fails)toast(fails+'장을 올리지 못했어요. 인터넷을 확인하고 다시 눌러 주세요');
}
function raceNew(){RACE.pos=0;RACE.fin=0;RACE.round++;RS_shown=0;RACE.ev=0;raceSave();render();}

var _dlgCb=null;
var CEL_M=[['🏆','숙제 완료! 오늘의 챔피언','꾸준함이 실력이 돼요'],['🚀','숙제 발사 성공!','다음 수업도 날아올라 봐요'],['🌟','별처럼 빛나는 숙제 끝!','스스로 해낸 게 가장 멋져요'],['🎉','해냈다! 숙제 올 클리어','오늘도 한 걸음 더 성장했어요'],['🦄','전설의 숙제 달성!','정말 대단해요']];

function ask(t,cb){$('dlgT').textContent=t;_dlgCb=cb;$('dlg').classList.add('on');}
function dlgNo(){_dlgCb=null;$('dlg').classList.remove('on');}
function dlgYes(){var f=_dlgCb;dlgNo();if(f)f();}
/* 저장 상태 알림: 저장 못 한 내용이 있으면 눈에 띄게 알려요 */
var saveFail=false,wasAll=false,noticeOpen=false;
function netPaint(){
  var n=$('net');if(!n)return;
  var off=(typeof navigator.onLine==='boolean'&&!navigator.onLine);
  if(off||saveFail){n.className='net on';n.textContent=pendingE?'⚠️ 인터넷이 불안정해서 아직 저장되지 않았어요. 연결되면 자동으로 저장돼요':'⚠️ 인터넷이 끊겼어요. 연결을 확인해 주세요';}
  else if(pendingE){n.className='net on ok';n.textContent='저장하는 중…';}
  else n.className='net';
}
window.addEventListener('online',function(){if(pendingE){clearTimeout(saveT);saveT=setTimeout(saveLog,300);}netPaint();});
window.addEventListener('offline',netPaint);
function mkP(){pendingE={k:logKey,e:LOG.e,tm:LOG.tm||{},nr:LOG.nr||0};netPaint();}
function safe(s){return String(s||'').replace(/[^\w가-힣]/g,'_');}

function ensureFirebase(){return Promise.resolve(typeof firebase!=='undefined');}
async function boot(){
  if(!(await ensureFirebase())){document.body.innerHTML='<div style="padding:40px;text-align:center;font-size:19px;line-height:1.6">인터넷 연결을 확인하고 새로고침해 주세요.</div>';return;}
  try{
    var qp=new URLSearchParams(location.search),qc=qp.get('cfg');
    if(qp.get('reset')){localStorage.removeItem('fb_cfg');localStorage.removeItem('hc_sid');history.replaceState(null,'',location.pathname);}
    else if(qc){var nc=JSON.parse(decodeURIComponent(escape(atob(qc))));if(nc&&nc.apiKey&&nc.projectId){var o=localStorage.getItem('fb_cfg'),n=JSON.stringify(nc);if(o!==n){localStorage.setItem('fb_cfg',n);localStorage.removeItem('hc_sid');}}}
  }catch(e){}
  var cfg=null;try{cfg=JSON.parse(localStorage.getItem('fb_cfg'));}catch(e){}
  if(!cfg||!cfg.apiKey||!cfg.projectId){show('sSetup');return;}
  try{firebase.app();}catch(e){firebase.initializeApp(cfg);}
  db=firebase.firestore();
  /* 익명 로그인: 학생은 아무것도 입력하지 않아요. 실패해도 홈체크는 계속 동작해요 */
  try{if(firebase.auth){var A=firebase.auth();var cu=await new Promise(function(r){var un=A.onAuthStateChanged(function(u){un();r(u);});});if(!cu)await A.signInAnonymously();}}catch(e){console.warn('[auth] 익명 로그인 실패',e);}
  buildPad();paintDots();
  var sid=null;try{sid=localStorage.getItem('hc_sid');}catch(e){}
  if(sid)resume(sid);else show('sLogin');
}
function saveCfg(){
  var cfg={apiKey:$('c-apiKey').value.trim(),authDomain:$('c-authDomain').value.trim(),projectId:$('c-projectId').value.trim(),storageBucket:$('c-storageBucket').value.trim()};
  if(!cfg.apiKey||!cfg.projectId){toast('apiKey와 projectId를 입력하세요');return;}
  localStorage.setItem('fb_cfg',JSON.stringify(cfg));location.reload();
}
function buildPad(){
  var h='';[1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="key('+n+')">'+n+'</button>';});
  h+='<button class="fn" onclick="clr()">지우기</button><button onclick="key(0)">0</button><button class="fn" onclick="back()" aria-label="한 칸 지우기">←</button>';
  $('pad').innerHTML=h;
}
function paintDots(){var h='';for(var i=0;i<5;i++)h+='<i class="'+(i<pin.length?'f':'')+'"></i>';$('dots').innerHTML=h;}
function key(n){if(busy)return;if(pin.length<5){pin+=n;paintDots();}if(pin.length===5)tryLogin();}
function back(){pin=pin.slice(0,-1);paintDots();$('err').textContent='';}
function clr(){pin='';paintDots();$('err').textContent='';}
function fail(msg){$('err').textContent=msg;var c=$('loginCard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');pin='';paintDots();busy=false;}
async function ensureAuth(){
  try{var A=firebase.auth();if(A.currentUser)return A.currentUser;await A.signInAnonymously();return A.currentUser;}
  catch(e){console.warn('[auth]',e);authErr=(e&&(e.code||e.message))||'오류';return null;}
}
var BAD=0,LOCK=0;
try{BAD=+localStorage.getItem('hc_bad')||0;LOCK=+localStorage.getItem('hc_lock')||0;}catch(e){}
async function tryLogin(){
  if(Date.now()<LOCK){fail('잠시 후에 다시 눌러 주세요 ('+Math.ceil((LOCK-Date.now())/1000)+'초)');return;}
  busy=true;$('err').textContent='';
  try{
    if(!(await ensureAuth())){fail('로그인 준비에 실패했어요. 새로고침해 주세요 ('+authErr+')');return;}
    var snap=await db.collection('homeRoster').where('pin','==',pin).get();
    if(snap.empty){BAD++;if(BAD>=5){LOCK=Date.now()+60000*Math.min(30,Math.pow(2,BAD-5));}try{localStorage.setItem('hc_bad',BAD);localStorage.setItem('hc_lock',LOCK);}catch(e){}fail(BAD>=5?'여러 번 틀렸어요. 잠시 후에 다시 눌러 주세요':'없는 번호예요. 다시 눌러 주세요');return;}
    BAD=0;LOCK=0;try{localStorage.removeItem('hc_bad');localStorage.removeItem('hc_lock');}catch(e){}
    var d=snap.docs[0];start(d.id);
  }catch(e){console.error(e);var cd=(e&&e.code)||'';fail(cd==='permission-denied'?'앱을 새로고침해 주세요 (권한 오류)':'연결이 불안정해요. 잠시 후 다시 눌러 주세요'+(cd?' ('+cd+')':''));}
  busy=false;
}
async function resume(sid){
  try{await ensureAuth();var d=await db.collection('homeRoster').doc(sid).get();
    if(d.exists){start(sid);return;}
    try{localStorage.removeItem('hc_sid');}catch(e){}show('sLogin');
  }catch(e){show('sLogin');toast('다시 연결하는 중이에요');setTimeout(function(){resume(sid);},3000);}
}
function start(sid){
  S=sid;try{localStorage.setItem('hc_sid',sid);}catch(e){}

async function shrink(file,max,q){
  var bmp;

  catch(e){bmp=await new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){URL.revokeObjectURL(u);res(im);};im.onerror=function(){rej(new Error('이 사진은 열 수 없어요'));};im.src=u;});}
  var w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
  var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc)),c=document.createElement('canvas');c.width=cw;c.height=ch;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(bmp,0,0,cw,ch);
  if(bmp.close)try{bmp.close();}catch(e){}
  var blob=await new Promise(function(r){c.toBlob(r,'image/jpeg',q);});
  if(!blob)throw new Error('사진을 줄이지 못했어요');
  return {blob:blob,w:cw,h:ch};
}

  try{

  }

function vrStart(){

  clearInterval(VR.tm);

  VR.dur=Math.min(VSEC,Math.round((Date.now()-VR.t0)/1000));
  var type=(VR.rec&&VR.rec.mimeType)||VR.mime||'video/mp4';
  VR.blob=new Blob(VR.chunks,{type:type});vrStopStream();
  var v=$('vrV');v.srcObject=null;VR.url=URL.createObjectURL(VR.blob);v.src=VR.url;v.muted=false;v.controls=true;
  var mb=(VR.blob.size/1048576).toFixed(1);
  if(VR.blob.size>VMB*1048576){vrSet('영상이 너무 커요','('+mb+'MB) 다시 짧게 찍어 주세요','<button onclick="vrCam()">다시 찍기</button><button onclick="vrClose()">닫기</button>');return;}
  vrSet('잘 찍혔는지 확인해 보세요',fmtT(VR.dur)+' · '+mb+'MB','<button onclick="vrCam()">다시 찍기</button><button class="pri" onclick="vrSend()">올리기</button>');
}
async function vrSend(){
  var blob=VR.blob,dur=VR.dur,iid=VR.itemId;if(!blob)return;
  vrClose();
  await sendVideo(blob,dur,iid);
}
async function pickVideo(inp,itemId){
  var f=inp.files&&inp.files[0];inp.value='';if(!f||!R||!R.les)return;
  if(f.size>VMB*1048576){toast('영상이 너무 커요 ('+Math.round(f.size/1048576)+'MB). 앱 안 녹화를 쓰거나 '+VMB+'MB 이하로 올려 주세요',5000);return;}
  await sendVideo(f,0,itemId);
}
async function sendVideo(blob,dur,itemId){
  var U=null;try{U=firebase.auth().currentUser;}catch(e){}
  if(!U){toast('로그인이 안 됐어요. 새로고침해 주세요');return;}
  var it=findItem(itemId);if(!it)return;
  if((UPL[itemId]||[]).length>=MAXV){toast('영상은 '+MAXV+'개까지 올릴 수 있어요');return;}
  UPB[itemId]=true;UPP[itemId]=0;render();
  try{await uploadVideo(blob,dur,it,U);toast('영상을 올렸어요');}
  catch(e){console.error(e);toast('영상을 올리지 못했어요. 인터넷을 확인하고 다시 해 주세요',4000);}
  UPB[itemId]=false;render();
}
function vthumb(blob){
  return new Promise(function(res){
    var done=false,u=URL.createObjectURL(blob),v=document.createElement('video');
    function fin(r){if(done)return;done=true;URL.revokeObjectURL(u);res(r);}
    setTimeout(function(){fin(null);},5000);
    v.muted=true;v.playsInline=true;v.preload='auto';
    v.onloadeddata=function(){try{v.currentTime=Math.min(0.2,(v.duration||1)/2);}catch(e){fin(null);}};
    v.onseeked=function(){
      try{
        var w=v.videoWidth,h=v.videoHeight;if(!w||!h)return fin(null);
        var sc=Math.min(1,240/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        c.toBlob(function(b){fin(b?{blob:b,w:w,h:h,dur:isFinite(v.duration)?Math.round(v.duration):0}:null);},'image/jpeg',.6);
      }catch(e){fin(null);}
    };
    v.onerror=function(){fin(null);};
    v.src=u;
  });
}
async function uploadVideo(blob,dur,it,U){
  var mime=(blob.type||'video/mp4').split(';')[0];
  var ext=mime.indexOf('mp4')>=0?'mp4':(mime.indexOf('quicktime')>=0?'mov':'webm');
  var th=await vthumb(blob);if(!dur&&th)dur=th.dur||0;
  var day=ymd(),base='hw/'+U.uid+'/'+safe(S)+'/'+day+'/'+safe(it.id)+'_'+Date.now();
  var st=hwStorage(),task=st.ref(base+'.'+ext).put(blob,{contentType:mime});
  task.on('state_changed',function(s){UPP[it.id]=s.totalBytes?Math.round(s.bytesTransferred*100/s.totalBytes):0;render();});
  await task;
  var tp='';
  if(th){try{await st.ref(base+'_t.jpg').put(th.blob,{contentType:'image/jpeg'});tp=base+'_t.jpg';}catch(e){console.warn('[썸네일]',e);}}
  var exp=new Date();exp.setMonth(exp.getMonth()+6);
  var ref=await db.collection('homeUploads').add({uid:U.uid,sid:S,name:R.name||'',lk:logKey,key:R.key||'',les:R.les||'',itemId:it.id,itemLabel:it.l||'',kind:'video',
    path:base+'.'+ext,thumb:tp,bucket:HW_BUCKET||'',size:blob.size,dur:dur||0,mime:mime,w:th?th.w:0,h:th?th.h:0,status:'제출',day:day,at:Date.now(),exp:firebase.firestore.Timestamp.fromDate(exp)});
  if(th)LP[ref.id]=URL.createObjectURL(th.blob);
  setChecked(it.id,true);
}
window.addEventListener('load',boot);
/* ── 홈 화면에 추가 안내 ── */
var _dp=null;
function _standalone(){try{return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}}
function _instClose(){try{localStorage.setItem('hc_inst','1');}catch(e){}var b=$('inst');if(b)b.style.display='none';}
function _instDo(){if(!_dp)return;_dp.prompt();try{_dp.userChoice.then(function(){_dp=null;_instClose();});}catch(e){}}
function showInst(){
  var box=$('inst');if(!box||_standalone())return;
  try{if(localStorage.getItem('hc_inst')==='1')return;}catch(e){}
  var ua=navigator.userAgent||'',ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
  if(!ios&&!android&&!_dp)return;
  var t='',btn='';
  if(_dp){t='<b>📲 홈체크를 앱처럼 설치할 수 있어요</b>홈 화면에 아이콘이 생겨서 링크를 다시 찾지 않아도 돼요.';btn='<button class="pri" onclick="_instDo()">설치하기</button>';}
  else if(ios){
    if(/CriOS|FxiOS|EdgiOS|KAKAOTALK|Line\/|NAVER|Instagram/i.test(ua))t='<b>📲 홈 화면에 추가하려면</b>이 링크를 <b style="display:inline">사파리</b>로 열어 주세요. 크롬이나 카카오톡 안에서는 "홈 화면에 추가"가 나오지 않아요.';
    else t='<b>📲 홈 화면에 추가하세요</b>화면 아래쪽 <b style="display:inline">공유 버튼(네모에 위쪽 화살표)</b>을 누르고 <b style="display:inline">"홈 화면에 추가"</b>를 눌러 주세요.';
  }else t='<b>📲 홈 화면에 추가하세요</b>브라우저 오른쪽 위 <b style="display:inline">⋮ 메뉴</b>에서 <b style="display:inline">"홈 화면에 추가"</b> 또는 <b style="display:inline">"앱 설치"</b>를 눌러 주세요.';
  box.innerHTML=t+'<div class="ib">'+btn+'<button onclick="_instClose()">닫기</button></div>';box.style.display='block';
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_dp=e;showInst();});
window.addEventListener('appinstalled',function(){_instClose();});
window.addEventListener('load',function(){setTimeout(showInst,400);});
</script>
