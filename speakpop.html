<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speak Pop!</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--ink:#1d2433;--sub:#6b7280;--line:#e5dfd2;--ac:#0f9d7a;--ac2:#e8f6f1;--warn:#e8590c;--warn2:#fff1e8;--navy:#1d2a44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100dvh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{font-size:18px;margin:0;flex:1}
.ib{width:28px;height:28px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1;padding:0;flex:none}
.hrow{position:relative;display:flex;justify-content:center;margin-bottom:14px}
.hero{display:block;text-align:center;padding:2px 44px}
.hero h1{margin:0;font-size:16px;line-height:1.05;font-weight:800;color:#b5401a;letter-spacing:-.5px}
.hero .s1{margin-top:2px;font-size:10px;font-weight:600;color:#a14a2b}
.hero .s2{margin-top:1px;font-size:9.5px;color:#8a4a33}
.add{position:absolute;right:0;top:0;width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;color:#b5401a}
.chips{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.set{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.set b{font-size:16px;display:block}.set small{color:var(--sub);font-size:13px}
.set .tg{float:right;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.set .tg.m{background:#eef1ff;color:#4357d6}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.opt .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.opt label{font-size:14px;display:flex;align-items:center;gap:6px}
.seg{display:flex;background:#efe9db;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;background:transparent;font-size:14px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pbox{background:var(--card);border:2px dashed #c8bfa8;border-radius:18px;padding:22px 14px;text-align:center;margin:6px 0 14px}
.pbox .en{font-size:26px;font-weight:800}.pbox .ko{font-size:19px;margin-top:6px;color:var(--ink)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.w{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.w .e{font-size:20px}.w b{display:block;font-size:17px}.w small{color:var(--sub);font-size:14px}
.big{display:block;width:100%;padding:16px;border-radius:16px;font-size:17px;font-weight:800;background:var(--ac);color:#fff;margin-top:auto}
.big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.big:disabled{opacity:.4}
.prog{height:8px;background:#e6dfcf;border-radius:99px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 18px;min-height:240px;margin-bottom:14px;box-shadow:0 6px 18px rgba(60,50,20,.08)}
.card .tag{font-size:12px;font-weight:800;color:var(--ac);background:var(--ac2);padding:4px 10px;border-radius:99px;margin-bottom:14px}
.card .ic{font-size:44px;margin-bottom:6px}
.card .q{font-size:28px;font-weight:800;line-height:1.35;word-break:keep-all}
.card.mid .q{font-size:24px}
.card .hint{margin-top:12px;font-size:14px;color:var(--sub)}
.card .ans{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);width:100%}
.card .ans .a{font-size:26px;font-weight:600;line-height:1.35;word-break:keep-all}
.card.mid .ans .a{font-size:22px}.card .ans .a b{font-weight:900;color:var(--ac)}
.spk{margin-top:10px;padding:8px 16px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:800;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{padding:16px 8px;border-radius:16px;font-size:16px;font-weight:800}
.no{background:var(--warn2);color:var(--warn)}.ok{background:var(--ac);color:#fff}
.done{text-align:center;margin:auto 0}.done .st{font-size:54px;letter-spacing:4px}.done h2{font-size:24px;margin:8px 0}.done p{color:var(--sub);margin:4px 0}
.imp textarea,.imp input{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);margin:6px 0}
.imp textarea{min-height:170px}
.note{font-size:12px;color:var(--sub);line-height:1.5}

/* ── 3코너(임베드) · 레벨별 테마: B(저학년) · A(중간) · C(고학년/중등) ── */
body.thB{--bg:#FFF3C9;--line:#F0DCA0;--ac:#0F9D7A;--ac2:#DDF1E8;--navy:#0F5C4D}
body.thA{--bg:#EAF4EC;--line:#CFE3D8;--ac:#0F9D7A;--ac2:#DDF1E8;--navy:#0F5C4D}
body.thC{--bg:#F5F7F4;--line:#DCE5DF;--ac:#0F5C4D;--ac2:#E3F3EC;--navy:#0F5C4D}
.wm{text-align:center;font-weight:900;font-size:30px;letter-spacing:-.04em;color:#0F5C4D;margin:4px 0 2px}.wm b{color:#F5B800}
.sbt{text-align:center;color:var(--sub);font-size:13px;font-weight:700;margin-bottom:12px}
.tl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:26px;padding:16px 18px;margin-bottom:12px;color:#14302B;position:relative}
.tl .ico{font-size:40px;flex:none}.tl b{display:block;font-size:19px;letter-spacing:-.02em}.tl small{display:block;font-size:13px;opacity:.75;margin-top:2px}
.tl .st{margin-left:auto;font-size:13px;font-weight:900;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);white-space:nowrap}
.tl.dn .st{background:#0F5C4D;color:#fff}
.thB .tl.t1{background:linear-gradient(180deg,#FFE066,#FFC929);box-shadow:0 5px 0 #D9A400}
.thB .tl.t2{background:linear-gradient(180deg,#A4E37F,#6FCB4B);box-shadow:0 5px 0 #4FA032}
.thB .tl.t3{background:linear-gradient(180deg,#FFB3B3,#FF8A8A);box-shadow:0 5px 0 #D45C5C}
.thB .tl{padding:20px 18px;margin-bottom:16px}.thB .tl .ico{font-size:48px}.thB .tl b{font-size:22px}
.mis{display:flex;align-items:center;gap:8px;justify-content:center;margin:0 0 14px;font-weight:900;font-size:14px;color:#8A5A00}
.mis i{font-style:normal;background:#fff;border-radius:99px;padding:4px 12px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.hdA{background:#0F5C4D;color:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:900}
.hdA .p{font-size:12px;font-weight:700;opacity:.85}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.g3 .tl{flex-direction:column;text-align:center;padding:18px 6px 14px;margin:0;border-radius:22px;gap:6px}
.g3 .tl .ico{font-size:44px}.g3 .tl b{font-size:14px;line-height:1.25;word-break:keep-all}.g3 .tl small{font-size:11px}.g3 .tl .st{margin:4px 0 0;font-size:12px}
.thA .tl.t1,.thA .tl.t3{background:linear-gradient(180deg,#E3F5EA,#CFEBDB);box-shadow:0 3px 0 #A9D3BE}.thA .tl.t2{background:linear-gradient(180deg,#FFF1BF,#FFE48A);box-shadow:0 3px 0 #D9B84C}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px;font-size:12px;font-weight:800;color:var(--sub)}.flow span{background:#fff;border-radius:99px;padding:5px 10px;border:1px solid var(--line)}
.bar{height:10px;border-radius:99px;background:#E1ECE5;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:#0F9D7A;border-radius:99px;transition:width .3s}
.sum{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}.sum small{color:var(--sub);font-weight:700;font-size:12px}.sum b{display:block;font-size:24px;margin-top:2px}
.thC .tl{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}.thC .tl .ico{font-size:28px;width:44px;height:44px;border-radius:12px;background:#E3F3EC;display:flex;align-items:center;justify-content:center}.thC .tl b{font-size:16px}
.thC .tl.dn .ico{background:#0F5C4D}
.thC .big.go{margin:0 0 14px}
/* 3초 챌린지 */
.chip2{display:inline-block;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:800;background:var(--ac2);color:#0F5C4D;margin:0 3px}.chip2.y{background:#FFF1CC;color:#8A5A00}
.crow{text-align:center;margin:4px 0 12px}
.lst{background:#fff;border-radius:22px;padding:6px 14px;border:1px solid var(--line);margin-bottom:12px}
.lr{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 2px;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:26px;font-weight:900}.lr:last-child{border:0}
.lr span{font-size:12px;color:var(--sub);font-weight:700}.lr b{color:#0F9D7A}
.thB .lr{font-size:28px}
.sub2{text-align:center;font-size:13px;color:var(--sub);font-weight:700;margin:0 0 10px}
.cur2{background:#fff;border-radius:26px;padding:18px 12px;text-align:center;border:1px solid var(--line);margin-bottom:12px;min-height:250px}
.cur2 .k{color:var(--sub);font-size:14px;font-weight:700}.cur2 .s{font-size:60px;font-weight:900;line-height:1.1;margin:2px 0}
.ring{width:110px;height:110px;border-radius:50%;margin:8px auto;background:conic-gradient(#F5B800 0deg,#E7EEE8 0deg);display:flex;align-items:center;justify-content:center}
.ring i{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;font-style:normal;color:#C99400}
.ring.end i{color:#E5484D}
.ans2{font-size:34px;font-weight:900;color:#0F5C4D;margin:6px 0}
.pgrid{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}.pgrid i{font-style:normal;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:13px}.pgrid i.on{background:#FFD84D;border-color:#F5B800}.pgrid i.dn{background:var(--ac2);color:#0F5C4D}
/* 내 생각 말하기 */
.tcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:9px}
.tcard .h{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px}
.tcard .n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--ac2);color:#0F5C4D;display:flex;align-items:center;justify-content:center}
.tcard.cd .n,.thB .tcard.cd .n{background:#0F5C4D!important;color:#fff}
.tcard input{width:100%;margin:8px 0 6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text;background:#FBFDFB}
.tcard .sy{width:100%;padding:11px;border-radius:12px;background:var(--ac2);color:#0F5C4D;font-weight:900;font-size:15px}.tcard.cd .sy{background:#0F5C4D;color:#fff}
.thB .tcard:nth-of-type(5n+1) .n{background:#FFD1DC}.thB .tcard:nth-of-type(5n+2) .n{background:#C9E4FF}.thB .tcard:nth-of-type(5n+3) .n{background:#E4D7FF}.thB .tcard:nth-of-type(5n+4) .n{background:#FFE0B5}

/* ── 허브 · 3초 챌린지 메뉴 (로고처럼 갈색 테두리 스티커 느낌) ── */
:root{--brown:#4a2a16}
.hb{display:flex;align-items:center;justify-content:space-between;margin:0 0 2px}
.hb img.lg{height:64px;width:auto;display:block}.hb .htx{flex:1;min-width:0;margin:0 6px 0 4px;font-size:11px;word-break:keep-all;font-weight:800;line-height:1.35;color:#3d4d45}.hb .htx b{display:block;font-size:11.5px;color:#14302B;letter-spacing:-.01em}.hb .htx span{display:block}.htr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.htr .ht{margin:22px 2px 12px}.htr .vbt{flex:none;margin:0 2px 12px 0;padding:3px 9px;border-radius:9px;background:#fff;border:1.5px solid var(--brown);box-shadow:0 2px 0 var(--brown);font-size:11.5px;font-weight:900;line-height:1.25;color:#14302B;white-space:nowrap}.hb .ib{border:1.5px solid var(--brown);box-shadow:0 2px 0 var(--brown)}
.ht{font-size:21px;font-weight:900;letter-spacing:-.02em;color:#14302B;margin:22px 2px 12px;line-height:1.3;word-break:keep-all}
.hs{display:flex;align-items:center;gap:10px;margin:0 2px 20px}
.hs .sl{font-size:20px;font-weight:900;color:#14302B;white-space:nowrap}.hs .sl i{font-style:normal;color:#f5a000;margin-right:3px}
.hs .bar2{flex:1;height:16px;border-radius:99px;background:#fff;border:2.5px solid var(--brown);overflow:hidden}
.hs .bar2 i{display:block;height:100%;background:linear-gradient(180deg,#ffe35a,#ffc400);transition:width .4s}
.hs .sn{font-size:20px;font-weight:900;color:#14302B;white-space:nowrap}.hs .sn b{color:#e5484d}
.hcs{display:flex;flex-direction:column;gap:22px;margin-bottom:12px}
.hc{position:relative;width:100%;text-align:left;background:#fff;border:3px solid var(--brown);border-radius:24px;box-shadow:0 6px 0 var(--brown);padding:20px 14px 14px;color:#14302B;display:block}
.hc:active{transform:translateY(3px);box-shadow:0 3px 0 var(--brown)}
.hc.dn{background:#effbf2}
.hc .rw{display:flex;align-items:center;gap:12px;margin-top:12px}
.hc .hi{flex:none;width:88px;height:88px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--tint,#fff1b8)}
.hc .hi img{max-width:78px;max-height:78px;display:block}
.hc .hn{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--brown);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:var(--tint,#ffc400)}
.hc .hx{flex:1;min-width:0}
.hc .hx b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.hc .hx small{display:block;font-size:12.5px;color:#5b6b63;margin-top:4px;line-height:1.45;font-weight:700;word-break:keep-all}
.hc .hx em{display:block;font-style:normal;font-size:12px;color:#0F5C4D;margin-top:5px;font-weight:800;background:#e3f3ec;border-radius:8px;padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc .rb{position:absolute;top:-14px;right:16px;padding:6px 14px 11px;font-size:12.5px;font-weight:900;color:#fff;background:#2f6fe0;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);letter-spacing:-.01em}
.hc .rb.r1{background:#ffb800;color:#4a2a16}.hc .rb.r2{background:#1fa14a}
.hc .go{display:block;margin-top:12px;text-align:center;padding:11px 10px;border-radius:99px;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(180deg,#46c562,#25a044);border:2.5px solid var(--brown);box-shadow:0 3px 0 var(--brown)}
.hc .go.r1{background:linear-gradient(180deg,#ffdd55,#ffb800);color:#4a2a16}
.hc .go.r2{background:#fff;color:#1b7f3b}
.dsc{background:#fff;border:3px solid var(--brown);border-radius:22px;box-shadow:0 5px 0 var(--brown);padding:16px 14px 14px;text-align:center;margin:4px 0 22px}
.dsc.sm{padding:9px 12px 10px;margin:0 0 12px;box-shadow:0 3px 0 var(--brown);border-width:2.5px}.dsc.sm .dt{font-size:17px}.dsc.sm .dh{margin-top:5px}
.dsc .dt{font-size:22px;font-weight:900;letter-spacing:-.02em;color:#0F5C4D;line-height:1.3;word-break:keep-all}
.dsc .dh{margin-top:8px}
.dsc .dn2{font-size:12px;color:var(--sub);font-weight:700;margin-top:8px}
.tcnt{font-size:12px;color:var(--sub);font-weight:800;white-space:nowrap}
.rep2{background:#fff6d6;border:2.5px dashed #e0b400;border-radius:18px;padding:14px;text-align:center;font-size:18px;font-weight:900;color:#8a5a00;margin:0 0 12px}

/* ── 허브: 가로 배너 카드 (그림 배경 상자가 곧 카드) ── */
.bn{position:relative;display:block;width:100%;text-align:left;border:3px solid var(--brown);border-radius:28px;box-shadow:0 6px 0 var(--brown);min-height:134px;padding:16px 150px 14px 18px;overflow:hidden;color:#14302B;cursor:pointer;
  background:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.55) 1.5px,transparent 2px) 0 0/16px 16px,linear-gradient(135deg,var(--c1),var(--c2))}
.bn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--brown)}
.bn img{position:absolute;right:10px;bottom:8px;height:106px;width:auto;filter:drop-shadow(0 4px 0 rgba(74,42,22,.18))}
.bn b{display:block;font-size:23px;letter-spacing:-.03em;line-height:1.2;text-shadow:0 2px 0 rgba(255,255,255,.65)}
.bn small{display:block;font-size:13px;font-weight:700;color:#3d4d45;margin-top:5px;line-height:1.4;word-break:keep-all}
.bn .go{display:inline-block;margin-top:11px;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#46c562,#25a044);border:2.5px solid var(--brown);box-shadow:0 3px 0 var(--brown)}
.bn .go.r1{background:linear-gradient(180deg,#ffdd55,#ffb800);color:#4a2a16}.bn .go.r2{background:#fff;color:#1b7f3b}
/* 3초 챌린지 연습 선택 카드 높이 줄이기 */
.hc{padding:14px 14px 12px}
.hc .rw{margin-top:0}
.hc .go{margin-top:10px;padding:9px 10px;font-size:14.5px}
.hcs{gap:20px}

/* 0015 시안 스타일 헤더 */
.ph{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.ph .ib{flex:none;border:1.5px solid var(--brown);box-shadow:0 2px 0 var(--brown)}
.pb{position:relative;display:inline-flex;align-items:center;height:44px;padding:0 20px 0 46px;margin-left:26px;margin-right:auto;border-radius:99px;background:linear-gradient(180deg,var(--b1),var(--b2));border:3px solid var(--bd);box-shadow:0 3px 0 var(--bd);color:#fff;font-weight:900;font-size:19px;letter-spacing:-.02em;text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap}
.pb img{position:absolute;left:-24px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--bd);padding:4px;box-sizing:border-box;object-fit:contain}
.pb.ch{--b1:#35b556;--b2:#1f8f3f;--bd:#14532d}.pb.pt{--b1:#52c75a;--b2:#2fa84f;--bd:#1a6b32}.pb.th{--b1:#ff8a7a;--b2:#e5484d;--bd:#8f2a2a}.ph .ib{order:2}.pb.np{padding:0 18px;margin:0 0 8px;height:38px;font-size:18px}
.mp{display:flex;align-items:center;gap:8px;margin:0 0 12px auto;max-width:100%;width:fit-content;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid #f0d27a;font-size:12px;font-weight:800;color:#5b4a1e}

 'can':{pr:['m','can'],pa:['m','could'],fu:['be','able to'],n:'현재 can · 과거 could · 미래 will be able to (can은 미래형이 없어서 be able to를 써요)',mh:'-',mn:'cannot have p.p (~했을 리 없다)'},
 'may':{pr:['m','may'],pa:['be','allowed to'],fu:['be','allowed to'],n:'현재 may · 과거 was/were allowed to · 미래 will be allowed to',mh:'+-',mn:'may have p.p (~했을지도 모른다)'},
 'must':{pr:['m','must'],pa:['hv'],fu:['hv'],n:'현재 must · 과거 had to · 미래 will have to (must의 과거·미래는 have to를 써요)',mh:'+-',mn:'must have p.p (~했음에 틀림없다) · 부정은 cannot have p.p (~했을 리 없다)'},
 'have to':{pr:['hv'],pa:['hv'],fu:['hv'],n:'현재 have/has to · 과거 had to · 미래 will have to'},
 'be able to':{pr:['be','able to'],pa:['be','able to'],fu:['be','able to'],n:'현재 am/is/are able to · 과거 was/were able to · 미래 will be able to'},
 'be allowed to':{pr:['be','allowed to'],pa:['be','allowed to'],fu:['be','allowed to'],n:'현재 am/is/are allowed to · 과거 was/were allowed to · 미래 will be allowed to'},
 'do':{pr:['ax'],pa:['ax'],n:'현재 do/does · 과거 did (미래형은 없어요)'},
 'will':{pr:['m','will'],n:'현재만 연습해요 (과거·미래형이 없어요)'},
 'would':{pr:['m','would'],n:'현재 would',mh:'+-?',mn:'would have p.p (~했을 텐데)'},'could':{pr:['m','could'],n:'현재 could',mh:'+-?',mn:'could have p.p (~했을 수도 있다) · could not have p.p · Could ~ have p.p?'},'might':{pr:['m','might'],n:'현재 might',mh:'+-',mn:'might have p.p (~했을지도 모른다)'},
 'should':{pr:['m','should'],n:'현재 should (과거·미래형이 없어요)',mh:'+-?',mn:'should have p.p (~했어야 했는데)'},'shall':{pr:['m','shall'],n:'현재만 연습해요'}
};
function spModKey(v){var k=String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
 if(k==='cannot')k='can';if(k==='has to'||k==='had to')k='have to';if(k==='does'||k==='did')k='do';
 if(/^(am|is|are|was|were)? ?able to$/.test(k))k='be able to';if(/^(am|is|are|was|were)? ?allowed to$/.test(k))k='be allowed to';
 return k;}
function spModForm(v,t){var e=SP_MOD[spModKey(v)];if(e)return e[t]||null;return t==='pr'?['g']:null;}   /* 표에 없는 조동사는 현재만 */
function spModHas(v,f){var t=f.slice(0,2);if(t==='mh'){var e=SP_MOD[spModKey(v)];return !!(e&&e.mh&&e.mh.indexOf(f.charAt(2))>=0);}return !!spModForm(v,t);}
/* 이 연습 종류에서 쓸 수 있는 형태인가: be동사는 진행형(am being)을 쓰지 않고, 조동사는 표에 있는 시제만 */
function spFormOk(d,f){var t=f.slice(0,2);if(d.t==='modal')return spModHas(d.v,f);
  if(d.t==='be')return !/^(pg|ag|fg|pn|an|fn|mh)$/.test(t);
  if(t==='mh')return false;
  if(/^(pg|ag|fg|pn|an|fn)$/.test(t)&&spStative(d.v))return false;   /* 상태 동사는 진행형을 쓰지 않아요 */
  return true;}
function spModNote(v){var e=SP_MOD[spModKey(v)];return e?e.n+(e.mh?' · 조동사+have p.p: '+e.mn:''):'이 조동사는 현재만 연습해요';}
function spModGen(sp,v,s,t,p){
  var th=/^(He|She|It)$/.test(s),lc=s==='I'?'I':s.toLowerCase(),k=sp[0],w=sp[1];
  if(k==='m'||k==='g'){w=k==='g'?String(v).trim():w;return p==='+'?s+' '+w:p==='-'?s+' '+(w==='can'?'cannot':w+' not'):cap(w)+' '+lc;}
  if(k==='be'){
    if(t==='fu')return p==='+'?s+' will be '+w:p==='-'?s+' will not be '+w:'Will '+lc+' be '+w;
    var b=t==='pa'?((s==='I'||th)?'was':'were'):(s==='I'?'am':(th?'is':'are'));
    return p==='+'?s+' '+b+' '+w:p==='-'?s+' '+b+' not '+w:cap(b)+' '+lc+' '+w;}
  if(k==='hv'){
    if(t==='fu')return p==='+'?s+' will have to':p==='-'?s+' will not have to':'Will '+lc+' have to';
    if(t==='pa')return p==='+'?s+' had to':p==='-'?s+' did not have to':'Did '+lc+' have to';
    return p==='+'?s+' '+(th?'has':'have')+' to':p==='-'?s+' '+(th?'does':'do')+' not have to':(th?'Does ':'Do ')+lc+' have to';}
  /* ax: do / does / did */
  var a=t==='pa'?'did':(th?'does':'do');
  return p==='+'?s+' '+a:p==='-'?s+' '+a+' not':cap(a)+' '+lc;
}
/* 주어 s, 형태 f(예: 'pr-')에 맞는 정답을 만들어요. 반환 {a:화면에 보이는 정답, say:읽어 줄 말} */
function spGen(d,s,f){
  var th=/^(He|She|It)$/.test(s),lc=s==='I'?'I':s.toLowerCase(),t=f.slice(0,2),p=f.charAt(2),v=String(d.v||'').trim(),r;
  if(/^(pn|an|fn)$/.test(t)){
    if(!spFormOk(d,f))return {a:'',say:''};
    var ig=spIng(v),h3=th?'has':'have';
    if(t==='pn')r=p==='+'?s+' '+h3+' been '+ig:p==='-'?s+' '+h3+' not been '+ig:cap(h3)+' '+lc+' been '+ig;
    else if(t==='an')r=p==='+'?s+' had been '+ig:p==='-'?s+' had not been '+ig:'Had '+lc+' been '+ig;
    else r=p==='+'?s+' will have been '+ig:p==='-'?s+' will not have been '+ig:'Will '+lc+' have been '+ig;
    r=r.replace(/\s+/g,' ').trim();var sn=spNat(r+(p==='?'?'?':''));
    if(p==='+')sn=sn.replace(/^(I|You|We|They) have /,"$1've ").replace(/^(He|She|It) has /,"$1's ").replace(/^(I|You|We|They|He|She|It) had /,"$1'd ");
    return {a:p==='?'?r+' …?':r,say:sn};
  }
  if(/^(pg|ag|fg|pe|ae|fe)$/.test(t)){
    if(!spFormOk(d,f))return {a:'',say:''};
    var part,pf=t.charAt(1)==='e',bb,h2;
    if(pf){part=d.t==='be'?'been':spPP(d);
      if(t==='pe'){h2=th?'has':'have';r=p==='+'?s+' '+h2+' '+part:p==='-'?s+' '+h2+' not '+part:cap(h2)+' '+lc+' '+part;}
      else if(t==='ae')r=p==='+'?s+' had '+part:p==='-'?s+' had not '+part:'Had '+lc+' '+part;
      else r=p==='+'?s+' will have '+part:p==='-'?s+' will not have '+part:'Will '+lc+' have '+part;}
    else{part=spIng(v);
      if(t==='fg')r=p==='+'?s+' will be '+part:p==='-'?s+' will not be '+part:'Will '+lc+' be '+part;
      else{bb=t==='ag'?((s==='I'||th)?'was':'were'):(s==='I'?'am':(th?'is':'are'));r=p==='+'?s+' '+bb+' '+part:p==='-'?s+' '+bb+' not '+part:cap(bb)+' '+lc+' '+part;}}
    r=r.replace(/\s+/g,' ').trim();
    var sy=spNat(r+(p==='?'?'?':''));
    if(pf&&p==='+')sy=sy.replace(/^(I|You|We|They) have /,"$1've ").replace(/^(He|She|It) has /,"$1's ").replace(/^(I|You|We|They|He|She|It) had /,"$1'd ");   /* 완료의 have/has/had는 약하게 */
    return {a:p==='?'?r+' …?':r,say:sy};
  }
  if(d.t==='be'){
    if(t==='pr'){var b=s==='I'?'am':(th?'is':'are');r=p==='+'?s+' '+b:p==='-'?s+' '+b+' not':cap(b)+' '+lc;}
    else if(t==='pa'){var b2=(s==='I'||th)?'was':'were';r=p==='+'?s+' '+b2:p==='-'?s+' '+b2+' not':cap(b2)+' '+lc;}
    else r=p==='+'?s+' will be':p==='-'?s+' will not be':'Will '+lc+' be';
  }else if(d.t==='do'){
    if(t==='pr')r=p==='+'?s+' '+(th?spS3(v):v):p==='-'?s+' '+(th?'does':'do')+' not '+v:(th?'Does ':'Do ')+lc+' '+v;
    else if(t==='pa')r=p==='+'?s+' '+(String(d.vp||'').trim()||spEdV(v)):p==='-'?s+' did not '+v:'Did '+lc+' '+v;
    else r=p==='+'?s+' will '+v:p==='-'?s+' will not '+v:'Will '+lc+' '+v;
  }else{ // modal
    if(t==='mh'){
      if(!spModHas(v,f)||!String(d.mv||'').trim())return {a:'',say:''};
      var mk=spModKey(v),pp=spPP({v:d.mv,vpp:d.vpp});
      r=p==='+'?s+' '+mk+' have '+pp:p==='-'?s+' '+((mk==='must'||mk==='can')?'cannot':mk+' not')+' have '+pp:cap(mk)+' '+lc+' have '+pp;
      r=r.replace(/\s+/g,' ').trim();var sm=spNat(r+(p==='?'?'?':''));
      if(p==='+')sm=sm.replace(/\b(should|could|would|must|might) have\b/,"$1've");
      return {a:p==='?'?r+' …?':r,say:sm};
    }
    var sp=spModForm(v,t);if(!sp)return {a:'',say:''};
    r=spModGen(sp,v,s,t,p);
  }
  r=r.replace(/\s+/g,' ').trim();
  return {a:p==='?'?r+' …?':r,say:spNat(r+(p==='?'?'?':''))};
}
/* 듣고 따라하기용 '자연스러운 말투': 줄여 쓰면(I'm · You're · don't) be동사·조동사가 약하게 들려요. 의문문은 ?를 붙여 올려 읽게 해요 */
function spNat(t){
  t=String(t||'').replace(/\s*…\s*\?*\s*$/,'?').replace(/\s+/g,' ').trim();
  var q=/\?$/.test(t);if(q)t=t.slice(0,-1).trim();
  t=t.replace(/\bwill not\b/gi,function(m){return m.charAt(0)==='W'?"Won't":"won't";})
   .replace(/\b(do|does|did|was|were|must|should|would|could|is|are|has|have|had) not\b/gi,function(m,w){return w.charAt(0).toUpperCase()===w.charAt(0)?w+"n't":w+"n't";})
   .replace(/\bI am\b/g,"I'm").replace(/\b(You|We|They|you|we|they) are\b/g,"$1're").replace(/\b(He|She|It|he|she|it) is\b/g,"$1's")
   .replace(/\b(I|You|We|They|He|She|It|you|we|they|he|she|it) will\b/g,"$1'll");
  return t+(q?'?':'');
}
function cap(x){x=String(x||'');return x.charAt(0).toUpperCase()+x.slice(1);}
function spKo(s){for(var i=0;i<SP_SUBJ.length;i++)if(SP_SUBJ[i][0]===s)return SP_SUBJ[i][1];return '';}
/* 연습 하나(d)를 '형태별 묶음'으로 펼쳐요: [{label,rows:[{s,ko,a,say}]}] */
function spUnits(d){
  var out=[];
  if(d.t==='custom'){var rows=(d.rows||[]).filter(function(r){return r&&r.s&&r.a;}).map(function(r){return {s:r.s,ko:r.k||'',a:r.a,say:spNat(r.a)};});
    if(rows.length)out.push({label:d.nm||'직접 입력',rows:rows});return out;}
  var modal=d.t==='modal',subs=(d.subj&&d.subj.length?d.subj:SP_SUBJ.map(function(x){return x[0];}));
  var onlyPr=modal&&(d.f||[]).every(function(f){return f.slice(0,2)==='pr';});
  SP_FORMS.forEach(function(f){if((d.f||[]).indexOf(f)<0)return;if(!spFormOk(d,f))return;if(modal&&f.slice(0,2)==='mh'&&!String(d.mv||'').trim())return;
    out.push({label:spFLabel(f,onlyPr),kind:({be:'be동사',do:'일반동사',modal:'조동사'})[d.t],rows:subs.map(function(s){var g=spGen(d,s,f);return {s:s,ko:spKo(s),a:g.a,say:g.say};})});});
  return out;
}
function spDName(d){if(d.nm)return d.nm;if(d.t==='be')return 'be동사';if(d.t==='do')return '일반동사'+(d.v?' ('+d.v+')':'');if(d.t==='modal')return '조동사'+(d.v?' ('+d.v+')':'');return '직접 입력';}

/* ───────── 목소리 4가지 (en-US): 여자 2 · 남자 2, 밝은 톤 ─────────
   폰마다 들어 있는 목소리가 달라서, 이름으로 여자/남자를 골라요. 해당 목소리가 없으면 기본 목소리의 높낮이(pitch)로 대신해요. */
var VSLOTS=[
 {id:'f1',ic:'👩',lb:'여자 A',pn:['aria','samantha','allison','zira'],fb:1.25},
 {id:'f2',ic:'👩',lb:'여자 B',pn:['jenny','ava','michelle','emma','susan','nicky','joanna','google us english'],fb:1.1},
 {id:'m1',ic:'👨',lb:'남자 A',pn:['guy','aaron','eric','christopher','evan'],fb:.95},

];
function vResolve(){
  var vs=[];try{vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang);});}catch(e){}
  var used={},out={};
  VSLOTS.forEach(function(s){
    var hit=null;
    for(var i=0;i<s.pn.length&&!hit;i++){hit=vs.filter(function(v){return !used[v.name]&&v.name.toLowerCase().indexOf(s.pn[i])>=0;})[0]||null;}
    if(hit){used[hit.name]=1;out[s.id]={voice:hit,pitch:1.05,fb:false};}
    else out[s.id]={voice:null,pitch:s.fb,fb:true};
  });
  return out;
}
function speak(t){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;
    var r=vResolve()[PREF.voice||'f1']||{voice:null,pitch:1};
    if(r.voice)u.voice=r.voice;u.pitch=r.pitch;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hl(en,pat){   // 패턴 부분을 굵게 (사진처럼)

  if(p&&e.toLowerCase().indexOf(p.toLowerCase())===0)return '<b>'+e.slice(0,p.length)+'</b>'+e.slice(p.length);
  return e;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

function go(s){G.scr=s;render();}
function setVoice(v){PREF.voice=v;lsSet('sp_pref',PREF);render();speak('There are pencils.');}
function setDir(d){PREF.dir=d;lsSet('sp_pref',PREF);render();}
function openSet(id){G.set=allSets().filter(function(s){return s.id===id;})[0];if(G.set)go('learn');}
function sayW(p,i){speak(G.set.ps[p].w[i][1]);}
function sayC(p,i){speak(G.set.ps[p].c[i][1]);}
function mkDeck(){
  var s=G.set,d=[],k=0;
  s.ps.forEach(function(p){
    var part=[];
    function add(ko,en,ic){var dir=PREF.dir==='mix'?((k++%2)?'en':'ko'):PREF.dir;part.push(dir==='ko'?{q:ko,a:en,ic:ic,dir:'ko',key:en,pat:p.pat}:{q:en,a:ko,ic:ic,dir:'en',key:en,pat:p.pat});}
    if((PREF.words||!p.c.length)&&p.w)p.w.forEach(function(w){add(w[0],w[1],w[2]);});   // 문장이 없는 패턴은 단어로라도 연습해요
    p.c.forEach(function(c){add(c[0],c[1],c[2]);});
    d=d.concat(PREF.shuf?shuffle(part):part);   // 패턴 순서는 유지하고, 패턴 안에서만 섞어요
  });
  return d;
}
function start(){
  G.deck=mkDeck();G.i=0;G.show=false;G.first=0;G.retry=0;G.total=G.deck.length;G.seen={};
  if(!G.deck.length){alert('연습할 문장이 아직 없어요. 선생님께 알려 주세요.');return;}
  G.scr='play';render();autoSpeak();
}
function autoSpeak(){var c=G.deck[G.i];if(c&&c.dir==='en'&&!G.show)speak(c.q);}
function reveal(){G.show=true;render();var c=G.deck[G.i];if(c.dir==='ko')speak(c.a);}
function mark(ok){
  var c=G.deck[G.i];
  if(ok){if(!G.seen[c.key+'|'+c.dir])G.first++;G.seen[c.key+'|'+c.dir]=1;}
  else{if(!G.seen[c.key+'|'+c.dir]){G.seen[c.key+'|'+c.dir]=2;}G.deck.push({q:c.q,a:c.a,ic:c.ic,dir:c.dir,key:c.key,pat:c.pat,re:1});if(!c.re)G.retry++;}
  if(ok&&c.re)G.retry=Math.max(0,G.retry-1);
  G.i++;G.show=false;
  if(G.i>=G.deck.length){finish();return;}
  render();autoSpeak();
}
function finish(){G.scr='done';render();try{window.parent!==window&&window.parent.postMessage({type:'speak-done',corner:'pt',set:G.set.id,total:G.total,first:G.first},'*');if(G.done)G.done.pt=1;}catch(e){}}

function saveImp(){
  var t=($('#im-t').value||'').trim(),x=$('#im-x').value||'',ps=[],cur=null;
  x.split(/\r?\n/).forEach(function(l){

    var m=l.split(/\t|\||=/);if(m.length<2)return;

  });
  ps=ps.filter(function(p){return p.c.length;});

  var c=G.ch,u=c.u[c.ui],L=G.ls,fin=c.st[c.ui].a===2&&!L;
  return chHead(1,'한 줄씩 듣고 따라 말하기','r')+'<div class="sub2">'+(L?'듣고 나면 따라 말해 봐요':(fin?'잘했어요! 한 번 더 해도 좋아요':'줄을 누르면 그 줄만 들을 수 있어요'))+'</div>'
   +'<div class="lst">'+u.rows.map(function(r,i){var on=L&&L.i===i;return '<button class="lr" style="'+(on?'background:#FFF6D6;border-radius:12px':'')+'" onclick="chSay('+i+')"><div>'+avOf(r.s)+hlA(r)+'</div><span>'+(on?(L.ph==='say'?'🔊 듣는 중':'🎤 따라 말해요!'):esc(r.ko))+'</span></button>';}).join('')+'</div>'
   +'<button class="big ghost" style="margin:0 0 10px;padding:12px;font-size:15px" onclick="chListen()">'+(L?'⏹ 멈추기':'🔊 처음부터 듣기')+'</button>'
   +'<button class="big" style="margin-top:auto" onclick="chMenu()">'+(fin?'✓ 다 했어요 · 연습 메뉴로':'연습 메뉴로')+'</button>';
}
/* ② 전체 듣고 → 이어서 따라 말하기 */
function vCh1b(){
  var c=G.ch,u=c.u[c.ui],L=G.lb,end=L&&L.ph==='end';
  return chHead(2,'전체 듣고 따라 말하기','b')+'<div class="sub2">'+(end?'이제 위에서부터 끝까지 이어서 따라 말해 봐요':(L?'먼저 전체를 쭉 들어 봐요':'전체를 한 번에 들려줘요'))+'</div>'
   +'<div class="lst">'+u.rows.map(function(r,i){var on=L&&L.ph==='say'&&L.i===i;return '<button class="lr" style="'+(on?'background:#FFF6D6;border-radius:12px':'')+'" onclick="chSay('+i+')"><div>'+avOf(r.s)+hlA(r)+'</div><span>'+(on?'🔊 듣는 중':esc(r.ko))+'</span></button>';}).join('')+'</div>'
   +(end?'<div class="rep2">🎤 이제 전체를 이어서 따라 말해요!</div><div class="two"><button class="no" onclick="lbStart()">🔁 다시 듣기</button><button class="ok" onclick="lbDone()">✓ 따라 말했어요</button></div>'
        :'<button class="big ghost" style="margin:0 0 10px;padding:12px;font-size:15px" onclick="'+(L?'lbStop()':'lbStart()')+'">'+(L?'⏹ 멈추기':'🔊 전체 듣기')+'</button>')
   +'<button class="big ghost" style="margin-top:'+(end?'12px':'auto')+'" onclick="chMenu()">연습 메뉴로</button>';
}
function lbStop(noPaint){var L=G.lb;if(!L)return;L.stop=1;clearTimeout(L.t);G.lb=null;try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}if(!noPaint&&G.scr==='ch1b')lsPaint();}
function lbStart(){lbStop(true);lsStop(true);chSt('b',1);G.lb={i:-1,ph:'say',stop:0};lbNext();}
function lbNext(){
  var L=G.lb;if(!L||L.stop)return;
  var u=G.ch.u[G.ch.ui];L.i++;
  if(L.i>=u.rows.length){L.ph='end';L.i=-1;lsPaint();return;}
  L.ph='say';lsPaint();
  speakCb(u.rows[L.i].say,function(){if(G.lb!==L||L.stop)return;L.t=setTimeout(lbNext,600);});
}
function lbDone(){chSt('b',2);chMenu();}
/* 듣고 따라하기: 한 줄 들려주고 → 따라 말할 시간을 주고 → 다음 줄 */
function speakCb(t,cb){
  var done=false,fin=function(){if(!done){done=true;cb();}};
  try{
    if(!window.speechSynthesis){setTimeout(fin,1200);return;}
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;
    var r=vResolve()[PREF.voice||'f1']||{voice:null,pitch:1};
    if(r.voice)u.voice=r.voice;u.pitch=r.pitch;
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
    setTimeout(fin,7000);   // 일부 기기는 끝 알림이 안 와서 안전장치
  }catch(e){setTimeout(fin,1200);}
}
function lsPaint(){var y=window.pageYOffset;render();window.scrollTo(0,y);}
function lsStop(noPaint){var L=G.ls;if(!L)return;L.stop=1;clearTimeout(L.t);G.ls=null;try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}if(!noPaint&&G.scr==='ch1')lsPaint();}
function chListen(){
  if(G.ls){lsStop();return;}
  lbStop(true);chSt('a',1);G.ls={i:-1,ph:'',stop:0};lsNext();
}
function lsNext(){
  var L=G.ls;if(!L||L.stop)return;
  var u=G.ch.u[G.ch.ui];L.i++;
  if(L.i>=u.rows.length){G.ls=null;chSt('a',2);lsPaint();return;}
  L.ph='say';lsPaint();
  var r=u.rows[L.i];
  speakCb(r.say,function(){
    if(G.ls!==L||L.stop)return;
    L.ph='rep';lsPaint();
    L.t=setTimeout(lsNext,1300+String(r.say).split(/\s+/).length*550);   // 따라 말할 시간
  });
}
function chSay(i){var r=G.ch.u[G.ch.ui].rows[i];speak(r.say);}
/* Step 2: 주어와 뜻만 보고, 위에서 아래까지 전부 제한 시간 안에 말해요 */
function chGo(){var c=G.ch;c.run=1;render();chTimer();}
function chTimer(){
  var c=G.ch,u=c.u[c.ui],t0=Date.now(),ms=u.sec*1000;chStop();
  _tm=setInterval(function(){
    var left=Math.max(0,ms-(Date.now()-t0)),ring=document.getElementById('ring'),rn=document.getElementById('rn');
    if(!ring){chStop();return;}
    ring.style.background='conic-gradient(#2fb350 '+Math.round(left/ms*360)+'deg,#E7EEE8 0deg)';rn.textContent=Math.ceil(left/1000);
    if(left<=0){chStop();ring.className='ring end';rn.textContent='0';}
  },80);
}
function vCh2(){
  var c=G.ch,u=c.u[c.ui],run=c.run||0;
  var h=chHead(3,'3초 안에 말하기','g')+'<div class="sub2">'+(run===2?'정답을 확인해요 (눌러서 들어 보기)':(run===1?'지금! 위에서부터 끝까지 전부 말해요':'주어와 뜻을 보고 <b>'+u.sec+'초 안에</b> 위에서부터 끝까지 전부 말해요'))+'</div>';
  if(run===1)h+='<div class="rc"><div class="ring" id="ring" style="margin:0 auto 4px;width:92px;height:92px;background:conic-gradient(#2fb350 360deg,#E7EEE8 0deg)"><i id="rn" style="width:70px;height:70px;font-size:36px;color:#1f7a3a">'+u.sec+'</i></div></div>';
  h+='<div class="lst">'+u.rows.map(function(r,i){
    var left=avOf(r.s)+(run===2?hlA(r):esc(r.s)+' <b style="color:#cfd8d2;letter-spacing:2px">…</b>');
    return '<button class="lr" style="font-size:24px"'+(run===2?' onclick="chSay('+i+')"':' disabled')+'><div>'+left+'</div><span>'+esc(r.ko)+'</span></button>';}).join('')+'</div>';
  if(run===0)h+='<button class="big" style="margin-top:auto" onclick="chGo()">▶ 시작! ('+u.sec+'초)</button>';
  else if(run===1)h+='<button class="big" style="margin-top:auto" onclick="chReveal()">정답 보기</button>';
  else h+='<div class="two"><button class="no" onclick="chAgain()">🔁 다시 도전</button><button class="ok" onclick="chMark(1)">✓ 해냈어요</button></div>';
  return h;
}
function chReveal(){chStop();G.ch.run=2;render();}
function chAgain(){var c=G.ch;c.tries[c.ui]=(c.tries[c.ui]||0)+1;c.run=0;render();}
function chMark(ok){
  var c=G.ch,u=c.u[c.ui];
  if(!(c.tries[c.ui]>0))c.first+=u.rows.length;   // 한 번에 해냈으면 전부 '한 번에 말한 카드'로 세요
  chSt('c',2);
  if(c.ui+1<c.u.length){c.ui++;G.scr='chm';render();return;}
  c.fin=1;G.scr='chdone';render();try{parent.postMessage({type:'speak-done',corner:'ch',total:c.total,first:c.first},'*');}catch(e){}if(G.done)G.done.ch=1;
}
function vChDone(){
  var c=G.ch,n=c.total,f=c.first,st=f>=n?'⭐⭐⭐':(f>=n*0.6?'⭐⭐':'⭐');
  return '<div class="done"><div class="st">'+st+'</div><h2>'+(f>=n?'모두 한 번에 말했어요!':'끝까지 해냈어요!')+'</h2><p>3초 말하기 챌린지 · 카드 '+n+'장</p><p>한 번에 말한 카드 <b>'+f+'</b>장</p></div>'
   +'<button class="big" style="margin-top:0" onclick="chInit()">한 번 더 ↻</button><button class="big ghost" onclick="emBack(1)">'+(G.hubOn?'코너 선택으로':'숙제로 돌아가기')+'</button>';
}
/* 내 생각 말하기 */
var TH_DEF=['우리 교실에서','우리 집에서','친구와 함께','내가 좋아하는 것','오늘 하루 중에'];
function thInit(){
  var t=G.em.set.th||{},hs=[],sl=t.sel||[];for(var i=0;i<5;i++){if(sl[i]===0)continue;hs.push((t.hints&&t.hints[i])||TH_DEF[i]);}
  if(!hs.length)hs.push(TH_DEF[0]);
  if(!G.th)G.th={hints:hs,tx:hs.map(function(){return '';}),ok:hs.map(function(){return 0;}),au:hs.map(function(){return 0;})};G.scr='th';render();
}
function vTh(){
  var T=G.th,s=G.em.set,ps=s.ps||[],cnt=T.ok.filter(Boolean).length,N=T.hints.length;
  var pat=ps.length?ps.map(function(p){return esc(p.pat)+' ~';}).join(' · '):'배운 패턴',pk=ps.length&&ps[0].pk?esc(ps[0].pk):'';
  var h='<div class="ph"><button class="ib" onclick="emBack()">✕</button>'+pbadge('th','내 생각 말하기')+'</div>'+mpill('창의 말하기 미션',cnt,N)
   +'<div class="sbub">이 패턴 ( <span class="pt">'+pat+'</span> )'+(pk?' <span style="color:var(--sub);font-size:13px">'+pk+'</span>':'')+'을<br>우리의 일상생활에서 언제 사용할 수 있을까요?<br>생각나는 상황을 <em>'+N+'가지로</em> 말해 보세요!</div>';
  T.hints.forEach(function(x,i){h+='<div class="tcard tc'+(i%5)+(T.ok[i]?' cd':'')+'"><div class="h"><span class="n">'+(T.ok[i]?'✓':(i+1))+'</span>'+esc(x)+'</div><input placeholder="말한 문장을 적어 둬도 돼요 (선택)" value="'+esc(T.tx[i])+'" oninput="G.th.tx['+i+']=this.value">'+audBtn(i)+'<button class="sy" onclick="thTog('+i+')">'+(T.ok[i]?'✓ 연습했어요':'🎤 소리 내어 연습했어요')+'</button></div>';});
  var up=G.thUp;
  h+='<div class="note" style="text-align:center;margin:2px 0 8px">연습이 끝나면 '+N+'가지를 이어서 말하는 <b>영상</b>을 찍어서 선생님께 보내요 (1분 안쪽이면 좋아요)</div>'
   +'<button class="big" '+((cnt<N||up)?'disabled':'')+' onclick="thFin()">'+(up?'영상을 올리는 중이에요…':(cnt<N?N+'가지를 연습하고 ✓를 눌러요':'🎥 영상으로 말하기'))+'</button>';
  return h;
}
/* 상황별 짧은 음성 녹음 (au: 0 없음 · 1 녹음중 · 2 올리는중 · 3 올림 · 4 실패) */
var AUD=null,AUD_MAX=20;
function audBtn(i){
  var a=(G.th.au||[])[i]||0;
  if(!window.MediaRecorder||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return '';
  var b=a===1?'<button class="sy" style="background:#e5484d;color:#fff;margin-bottom:6px" onclick="audStop()">⏹ 녹음 끝내기</button>'
   :a===2?'<button class="sy" disabled style="margin-bottom:6px;opacity:.6">선생님께 보내는 중…</button>'
   :'<button class="sy" style="margin-bottom:6px" onclick="audStart('+i+')">'+(a===3?'🔁 다시 녹음하기':'🎤 녹음해서 선생님께 보내기')+'</button>';
  return b+(a===3?'<div class="note" style="text-align:center;margin:-2px 0 6px;color:#0F5C4D;font-weight:800">✓ 선생님께 보냈어요</div>':'')+(a===4?'<div class="note" style="text-align:center;margin:-2px 0 6px;color:#e8590c">보내지 못했어요. 다시 눌러 주세요</div>':'');
}
function audPaint(){var y=window.pageYOffset;render();window.scrollTo(0,y);}
function audStart(i){
  if(AUD||!G.th)return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mt='';try{['audio/mp4','audio/webm;codecs=opus','audio/webm'].some(function(m){if(MediaRecorder.isTypeSupported(m)){mt=m;return true;}});}catch(e){}
    var rec;try{rec=mt?new MediaRecorder(st,{mimeType:mt,audioBitsPerSecond:32000}):new MediaRecorder(st);}catch(e){try{rec=new MediaRecorder(st);}catch(e2){st.getTracks().forEach(function(t){t.stop();});alert('이 기기에서는 녹음을 쓸 수 없어요');return;}}
    AUD={i:i,rec:rec,st:st,ch:[],t0:Date.now(),tm:setTimeout(audStop,AUD_MAX*1000)};
    rec.ondataavailable=function(e){if(e.data&&e.data.size)AUD.ch.push(e.data);};
    rec.onstop=function(){
      var A=AUD;AUD=null;clearTimeout(A.tm);A.st.getTracks().forEach(function(t){t.stop();});
      var m=(A.rec.mimeType||mt||'audio/mp4'),blob=new Blob(A.ch,{type:m}),dur=(Date.now()-A.t0)/1000;
      if(!G.th||blob.size<800){if(G.th){G.th.au[A.i]=0;if(G.scr==='th')audPaint();}return;}
      G.th.au[A.i]=2;if(G.scr==='th')audPaint();
      try{parent.postMessage({type:'speak-aud',i:A.i,label:G.th.hints[A.i],blob:blob,dur:dur,mime:m},'*');}catch(e){G.th.au[A.i]=4;audPaint();}
    };
    G.th.au[i]=1;audPaint();rec.start();
  }).catch(function(){alert('마이크 사용을 허용해 주세요');});
}
function audStop(){try{if(AUD&&AUD.rec.state!=='inactive')AUD.rec.stop();}catch(e){}}
window.addEventListener('message',function(ev){
  var d=ev.data;if(!d||d.type!=='speak-aud-state'||!G.th)return;
  G.th.au[d.i]=d.s==='ok'?3:4;if(G.scr==='th')audPaint();
});
function thTog(i){G.th.ok[i]=G.th.ok[i]?0:1;var y=window.pageYOffset;render();window.scrollTo(0,y);}
function thFin(){
  G.thUp=0;
  try{parent.postMessage({type:'speak-rec',texts:G.th.tx.map(function(x){return String(x||'').trim();})},'*');}catch(e){}
}
window.addEventListener('message',function(ev){
  var d=ev.data;if(!d||d.type!=='speak-th-state')return;
  if(d.s==='up'){G.thUp=1;if(G.scr==='th')render();}
  else if(d.s==='fail'){G.thUp=0;if(G.scr==='th')render();}
  else if(d.s==='ok'){G.thUp=0;if(G.done)G.done.th=1;G.scr='hub';render();}
});
var EMBED=false;try{EMBED=new URLSearchParams(location.search).get('embed')==='1';}catch(e){}
function _row(r){return Array.isArray(r)?r:[r.k||'',r.e||'',r.i||''];}
window.addEventListener('message',function(ev){
  var d=ev.data;if(!d||d.type!=='speak-set'||!d.set)return;
  var st=d.set;
  var ps=(st.ps||[]).map(function(p){return {pat:p.pat,pk:p.pk,w:(p.w||[]).map(_row),c:(p.c||[]).map(_row)};});
  lsStop(true);lbStop(true);G.ch=null;G.th=null;G.ptSeen=0;G.vhub=0;
  G.em={set:{title:st.title||'Speak Pop!',ps:ps,ch:st.ch||[],th:st.th||null}};G.theme=d.theme||'C';G.done=Object.assign({},d.done||{});
  document.body.className='th'+G.theme;
  var cs=corners();G.direct=true;
  if(cs.length===1&&cs[0]==='pt'){G.hubOn=false;G.set={id:'hc',lv:'x',title:G.em.set.title,ps:ps};G.scr='learn';}
  else{G.hubOn=true;G.scr='hub';}
  render();
});
if(EMBED){G.direct=true;try{if(new URLSearchParams(location.search).get('voice')==='1')G.scr='voice';}catch(e){}try{window.parent.postMessage({type:'speak-ready'},'*');}catch(e){}}
render();
</script>
</body>
</html>
